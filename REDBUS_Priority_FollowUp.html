<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedBus Priority Follow Up Report - CSC TravelCloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
    :root {
      --cream-bg: #f4f1e6;
      --cream-card: #faf8f2;
      --cream-alt: #f0ece0;
      --forest: #1b4332;
      --forest-dark: #122d22;
      --forest-soft: #e9f2ed;
      --gold: #c5a059;
      --gold-soft: #f7efe0;
      --charcoal: #141a17;
      --muted: #525d56;
      --border: #d5cfbe;
    }

    body {
      background-color: var(--cream-bg);
      color: var(--charcoal);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
      padding: 14px 15px;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Top Controls Bar */
    .controls-bar {
      background-color: var(--cream-card);
      border-radius: 10px;
      padding: 11px 16px;
      box-shadow: 0 3px 10px rgba(27, 67, 50, 0.08);
      border: 1.5px solid var(--forest);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .title-sec {
      font-family: 'Cinzel', serif;
      font-size: 16.5px;
      font-weight: 800;
      color: var(--forest);
      display: flex;
      align-items: center;
      gap: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    
    .filter-group { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    
    .dist-select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      min-width: 135px;
      color: var(--charcoal);
      background-color: #ffffff;
      cursor: pointer;
      height: 34px;
      transition: 0.2s;
    }
    .priority-select {
      border: 1.5px solid var(--gold);
      color: #7c4a12;
      background-color: var(--gold-soft);
      font-weight: 800;
    }
    .search-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      width: 170px;
      transition: 0.2s;
      height: 34px;
      background-color: #ffffff;
      color: var(--charcoal);
    }
    .search-box:focus, .dist-select:focus { border-color: var(--forest); box-shadow: 0 0 0 2px rgba(27, 67, 50, 0.15); }
    
    /* Royal Action Buttons */
    .btn-custom {
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 6px;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1.5px solid var(--forest);
      white-space: nowrap;
      cursor: pointer;
      height: 34px;
    }
    .btn-reset { background-color: #ffffff; color: var(--forest); }
    .btn-reset:hover { background-color: var(--forest); color: #ffffff; }

    .btn-export { background-color: var(--forest-soft); color: var(--forest-dark); border-color: #8ebaa3; }
    .btn-export:hover { background-color: var(--forest); color: #ffffff; }

    .btn-img { background-color: var(--gold); color: var(--charcoal); border-color: #a6823c; }
    .btn-img:hover { background-color: #b08a42; color: #ffffff; }

    .btn-full { background-color: #ffffff; color: var(--forest); }
    .btn-full:hover { background-color: var(--forest); color: #ffffff; }

    .btn-exit-full { background-color: #991b1b !important; color: #ffffff !important; border-color: #991b1b !important; }

    /* Main Content Wrapper */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--cream-card);
      padding: 15px 18px 0 18px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(27, 67, 50, 0.08);
      border: 1.5px solid var(--forest);
      overflow: hidden;
    }
    
    .report-main-header { text-align: center; margin-bottom: 14px; flex-shrink: 0; border-bottom: 2px dashed var(--gold); padding-bottom: 10px; }
    .report-main-title { font-family: 'Cinzel', serif; color: var(--forest-dark); font-weight: 800; margin: 0; font-size: 20px; letter-spacing: 0.7px; text-transform: uppercase; }
    .report-date-text { color: #7c4a12; font-weight: 700; margin: 4px 0 0 0; font-size: 13px; }

    /* Clickable KPI Cards */
    .kpi-container { display: flex; justify-content: center; gap: 16px; margin-bottom: 14px; flex-shrink: 0; }
    .kpi-card {
      background-color: #ffffff;
      padding: 11px 22px;
      border-radius: 9px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 8px rgba(27, 67, 50, 0.06);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 230px;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(27, 67, 50, 0.12); }
    .kpi-card span { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .kpi-card strong { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
    
    .kpi-targ { border-left: 5px solid var(--forest-dark); } .kpi-targ strong { color: var(--forest-dark); }
    .kpi-targ.active { border: 2px solid var(--forest); border-left: 6px solid var(--forest); background-color: var(--gold-soft); transform: scale(1.02); box-shadow: 0 5px 14px rgba(27, 67, 50, 0.16); }
    
    .kpi-ach { border-left: 5px solid #15803d; } .kpi-ach strong { color: #15803d; }
    .kpi-ach.active { border: 2px solid #15803d; border-left: 6px solid #15803d; background-color: var(--forest-soft); transform: scale(1.02); box-shadow: 0 5px 14px rgba(21, 128, 61, 0.16); }
    
    .kpi-bal { border-left: 5px solid #b91c1c; } .kpi-bal strong { color: #b91c1c; }
    .kpi-bal.active { border: 2px solid #b91c1c; border-left: 6px solid #b91c1c; background-color: #fef2f2; transform: scale(1.02); box-shadow: 0 5px 14px rgba(185, 28, 28, 0.16); }

    /* Scrollable Table Area */
    .scrollable-area { flex: 1; overflow-y: auto; overflow-x: auto; padding-right: 4px; padding-bottom: 18px; scroll-behavior: smooth; }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; white-space: nowrap; border: 1.5px solid var(--forest); border-radius: 8px; overflow: hidden; }
    
    thead { position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 5px rgba(27, 67, 50, 0.1); }
    thead th {
      vertical-align: middle;
      text-align: center;
      font-weight: 800;
      padding: 12px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #f8f5ec !important;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 2px solid var(--gold);
    }
    
    /* Royal Header Colors */
    .th-dist { background-color: var(--forest-dark) !important; border-right: 2px solid var(--gold) !important; }
    .th-name { background-color: #344e41 !important; }
    .th-id { background-color: #164e63 !important; }
    .th-mob { background-color: #4b5d54 !important; }
    .th-tx25 { background-color: #7c4a12 !important; }
    .th-tx26 { background-color: #991b1b !important; }
    .th-stat { background-color: var(--forest) !important; }
    .th-act { background-color: #15803d !important; }
    
    tbody tr td {
      text-align: center;
      vertical-align: middle;
      font-weight: 700;
      padding: 9px 10px;
      color: var(--charcoal);
      background-color: var(--cream-card);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid #e6e1d3;
      font-variant-numeric: tabular-nums;
    }
    tbody tr:nth-child(even) td { background-color: var(--cream-alt); }
    tbody tr:hover td { background-color: var(--gold-soft) !important; }
    
    .td-dist { text-align: left !important; font-weight: 800; color: var(--forest-dark); border-right: 2px solid var(--border) !important; }
    .vle-name { text-align: left !important; color: var(--charcoal); font-weight: 800; }
    .csc-id { font-family: monospace; font-size: 13px; color: #164e63; font-weight: 800; }
    
    .stat-pend { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 800; }
    .stat-act { background-color: #e6f4ea; color: #15803d; border: 1px solid #b7dfbe; padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 800; }
    
    .btn-wa {
      background-color: #15803d;
      color: #ffffff;
      border: 1px solid #166534;
      padding: 4px 11px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: 0.2s;
    }
    .btn-wa:hover { background-color: #166534; color: #ffffff; transform: scale(1.03); }

    /* 🌟 Compact WhatsApp Image Export Mode 🌟 */
    html.exporting, html.exporting body { height: auto !important; overflow: visible !important; background-color: var(--cream-bg) !important; }
    html.exporting .content-wrapper {
      width: 1100px !important; max-width: 1100px !important; height: auto !important;
      overflow: visible !important; display: block !important; padding: 20px 24px !important;
      box-shadow: none !important;
    }
    html.exporting .scrollable-area { height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; padding: 0 !important; }
    html.exporting thead { position: static !important; transform: none !important; }

    /* 📱 MOBILE RESPONSIVE STYLES 📱 */
    @media (max-width: 768px) {
      body { height: auto; overflow-y: auto; padding: 10px; }

      .controls-bar { flex-direction: column; gap: 11px; padding: 14px; align-items: stretch; height: auto; }
      .filter-group { flex-direction: column; gap: 9px; width: 100%; }
      .title-sec { justify-content: center; margin-right: 0 !important; margin-bottom: 4px; font-size: 15.5px; }
      .dist-select, .search-box, .btn-custom { width: 100% !important; height: 40px !important; justify-content: center; }
      
      .d-flex.gap-2.align-items-center { flex-wrap: wrap; justify-content: center; width: 100%; }
      .d-flex.gap-2.align-items-center .btn-custom { flex: 1 1 calc(50% - 10px); margin-left: 0 !important; }
      .d-flex.gap-2.align-items-center .priority-select { flex: 1 1 100%; }
      #fsBtn { display: none !important; }

      .report-main-title { font-size: 15.5px; line-height: 1.4; white-space: normal; }
      .report-date-text { font-size: 11px; }

      .kpi-container { flex-direction: column; gap: 10px; }
      .kpi-card { width: 100%; min-width: unset; padding: 12px 15px; justify-content: space-between; }
      .kpi-card span { font-size: 11px; }
      .kpi-card strong { font-size: 20px; }

      .content-wrapper { padding: 12px 10px; overflow: visible; height: auto; }
      .scrollable-area { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }
      th, td { padding: 9px 7px; font-size: 11px; }
      thead th { padding: 10px 6px; top: 0 !important; }
    }
  </style>

<body>

  <div class="controls-bar" data-html2canvas-ignore="true">
    
    <div class="filter-group">
      <div class="title-sec me-2">🚌 REDBUS: FOLLOW UP</div>
      
      <select id="distTypeDropdown" class="dist-select" onchange="processData()">
          <option value="OLD">Old Districts</option>
          <option value="NEW">New Districts</option>
      </select>
      
      <select id="distDropdown" class="dist-select" onchange="renderView()">
          <option value="">All Districts</option>
      </select>
      
      <input type="text" id="searchInput" class="search-box" placeholder="Search VLE Name / ID..." onkeyup="renderView()">
    </div>

    <div class="d-flex gap-2 align-items-center">
      <select id="priorityDropdown" class="dist-select priority-select" onchange="renderView()">
          <option value="ALL">All Targets (>= 1)</option>
          <option value="SUPER">Super Priority (>= 100)</option>
          <option value="HIGH">High Priority (50 to 99)</option>
          <option value="MEDIUM">Medium Priority (10 to 49)</option>
          <option value="BASIC">Basic Priority (1 to 9)</option>
      </select>

      <button class="btn-custom btn-reset" onclick="resetFilters()">↺ Reset</button>
      <button class="btn-custom btn-export" onclick="exportToExcel()">📥 Excel</button>
      <button class="btn-custom btn-img" onclick="downloadImage()">📸 Download Image</button>
      <button id="fsBtn" class="btn-custom btn-full" onclick="toggleFullScreen()">⛶ Fullscreen</button>
    </div>

  </div>

  <div class="content-wrapper" id="captureArea">
    
    <div class="report-main-header">
        <h2 class="report-main-title">CSC AP – REDBUS PRIORITY FOLLOW UP REPORT (FY 26-27)</h2>
        <p class="report-date-text" id="reportDateTxt"></p>
    </div>

    <!-- Clickable KPI Cards -->
    <div class="kpi-container" id="kpiCards">
        <div class="kpi-card kpi-targ active" id="cardALL" onclick="filterByBox('ALL')" title="Click to show All VLEs">
            <span>TOTAL TARGET VLES:</span> <strong id="kpiTarget">0</strong>
        </div>
        <div class="kpi-card kpi-ach" id="cardACTIVATED" onclick="filterByBox('ACTIVATED')" title="Click to show only Activated VLEs">
            <span>ACTIVATED VLES:</span> <strong id="kpiAchieved">0</strong>
        </div>
        <div class="kpi-card kpi-bal" id="cardPENDING" onclick="filterByBox('PENDING')" title="Click to show only Pending VLEs">
            <span>STILL PENDING VLES:</span> <strong id="kpiPending">0</strong>
        </div>
    </div>

    <div class="scrollable-area" id="scrollableArea">
      <table id="reportTable">
        <thead>
          <tr>
            <th class="th-dist text-start ps-3" style="width: 12%;">DISTRICT</th>
            <th class="th-name text-start ps-3" style="width: 18%;">VLE NAME</th>
            <th class="th-id">CSC ID</th>
            <th class="th-mob">MOBILE NO</th>
            <th class="th-tx25">FY 25-26 TXNS</th>
            <th class="th-tx26">FY 26-27 TXNS</th>
            <th class="th-stat">STATUS</th>
            <th class="th-act">ACTION (FOLLOW-UP)</th>
          </tr>
        </thead>
        <tbody id="reportBody">
          <tr><td colspan="8" style="color: var(--forest); padding: 35px; text-align: center; font-weight: 800;">Loading Follow Up Data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec";
    
    let loggedInDesig = localStorage.getItem("userDesignation") || "DM"; 
    let loggedInUserId = localStorage.getItem("userId") || ""; 
    let isDM = loggedInDesig.toUpperCase() === "DM" || loggedInDesig.toUpperCase().indexOf("DISTRICT MANAGER") !== -1;
    
    const CACHE_KEY = "TRAVEL_CACHE_V6_REDBUS_" + loggedInUserId;

    let rawData = [];
    let processedVleData = [];
    let currentTableData = [];
    let selectedDistFilter = ""; 
    let currentBoxFilter = "ALL";

    window.onload = async function() {
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        document.getElementById('reportDateTxt').innerText = "Report Generated on: " + new Date().toLocaleDateString('en-US', dateOptions);

        let cachedObj = await getCachedData(CACHE_KEY);
        if(cachedObj && (Date.now() - cachedObj.timestamp < 3600000)) {
            rawData = cachedObj.data;
            processData();
        } else {
            fetchDataFromServer();
        }
    };

    const DB_NAME = "CscTravelDB"; const STORE_NAME = "ReportsData";
    function openDB() { return new Promise((res, rej) => { let req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = (e) => { let db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME); }; req.onsuccess = (e) => res(e.target.result); req.onerror = (e) => rej(e.target.error); }); }
    async function getCachedData(key) { try { let db = await openDB(); return new Promise((res) => { let tx = db.transaction(STORE_NAME, "readonly"); let req = tx.objectStore(STORE_NAME).get(key); req.onsuccess = () => res(req.result); req.onerror = () => res(null); }); } catch(e) { return null; } }
    
    function fetchDataFromServer() {
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getTravelVlePerformance", service: "REDBUS", role: loggedInDesig, userId: loggedInUserId }) })
        .then(res => res.json()).then(res => { if(res.success && res.data) { rawData = res.data; processData(); } }).catch(e => { alert("Network Error"); });
    }
    
    function toProperCase(str) { if (!str || str.trim() === "") return "Unknown"; return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase()); }

    function processData() {
        let isNew = document.getElementById("distTypeDropdown").value === "NEW";
        
        let distSet = new Set();
        processedVleData = [];

        rawData.forEach(r => {
            if (isNew && isDM && !r.isMyNewDist) return; 
            
            let distName = toProperCase((isNew ? r.newDist : r.oldDist).trim());
            if(distName === "Unknown") return;
            
            let tx25 = r.srv2526 || 0;
            let tx26 = r.srv2627 || 0;
            
            if(tx25 > 0) {
                distSet.add(distName);
                
                processedVleData.push({
                    dist: distName,
                    name: r.vleName || "CSC VLE",
                    cscId: r.cscId,
                    mobile: r.mobile || "N/A",
                    tx25: tx25,
                    tx26: tx26,
                    status: tx26 > 0 ? "ACTIVATED" : "PENDING" 
                });
            }
        });

        processedVleData.sort((a, b) => {
            if(a.status === "PENDING" && b.status !== "PENDING") return -1;
            if(a.status !== "PENDING" && b.status === "PENDING") return 1;
            return b.tx25 - a.tx25;
        });
        
        let distArr = Array.from(distSet).sort();
        let distDropdown = document.getElementById("distDropdown");
        distDropdown.innerHTML = '<option value="">All Districts</option>';
        distArr.forEach(d => { distDropdown.innerHTML += `<option value="${d}">${d}</option>`; });

        renderView();
    }

    window.filterByBox = function(boxType) {
        currentBoxFilter = boxType;
        document.getElementById("cardALL").classList.remove("active");
        document.getElementById("cardACTIVATED").classList.remove("active");
        document.getElementById("cardPENDING").classList.remove("active");
        document.getElementById("card" + boxType).classList.add("active");
        renderView();
    };

    window.resetFilters = function() {
        document.getElementById("distDropdown").value = "";
        document.getElementById("distTypeDropdown").value = "OLD";
        document.getElementById("searchInput").value = "";
        document.getElementById("priorityDropdown").value = "ALL";
        selectedDistFilter = "";
        filterByBox("ALL"); 
        processData();
    };

    window.toggleFullScreen = function() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(e => { alert("Error: " + e.message); }); } 
        else { document.exitFullscreen(); }
    };
    
    document.addEventListener('fullscreenchange', () => {
        let fsBtn = document.getElementById("fsBtn");
        if (document.fullscreenElement) { fsBtn.innerHTML = "✖ Exit Fullscreen"; fsBtn.classList.replace("btn-full", "btn-exit-full"); } 
        else { fsBtn.innerHTML = "⛶ Fullscreen"; fsBtn.classList.replace("btn-exit-full", "btn-full"); }
    });

    function renderView() {
        let searchTxt = document.getElementById("searchInput").value.toUpperCase();
        let dropDownVal = document.getElementById("distDropdown").value;
        let priorityVal = document.getElementById("priorityDropdown").value;
        
        let baseFilteredData = processedVleData.filter(d => {
            let matchSearch = d.name.toUpperCase().includes(searchTxt) || d.cscId.toUpperCase().includes(searchTxt);
            let matchDist = (dropDownVal === "" || d.dist === dropDownVal);
            
            let matchPriority = true;
            if(priorityVal === "SUPER") matchPriority = d.tx25 >= 100;
            else if(priorityVal === "HIGH") matchPriority = d.tx25 >= 50 && d.tx25 <= 99;
            else if(priorityVal === "MEDIUM") matchPriority = d.tx25 >= 10 && d.tx25 <= 49;
            else if(priorityVal === "BASIC") matchPriority = d.tx25 >= 1 && d.tx25 <= 9;

            return matchSearch && matchDist && matchPriority;
        });
        
        let tTarg = baseFilteredData.length;
        let tAch = 0, tPend = 0;
        baseFilteredData.forEach(d => { if(d.status === "ACTIVATED") tAch++; else tPend++; });

        document.getElementById("kpiTarget").innerText = tTarg;
        document.getElementById("kpiAchieved").innerText = tAch;
        document.getElementById("kpiPending").innerText = tPend;

        let tableData = baseFilteredData.filter(d => {
            return (currentBoxFilter === "ALL" || d.status === currentBoxFilter);
        });

        currentTableData = tableData;
        renderTableOnly(tableData);
    }

    function renderTableOnly(dataArray) {
        let tbody = document.getElementById("reportBody");
        tbody.innerHTML = "";

        if(dataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="color:#b91c1c; padding:30px; text-align:center; font-weight:800;">No VLE Found</td></tr>`;
            return;
        }

        let displayLimit = 200;
        let renderCount = 0;

        dataArray.forEach((d) => {
            if(renderCount < displayLimit) {
                let statClass = d.status === "ACTIVATED" ? "stat-act" : "stat-pend";
                
                let waMsg = encodeURIComponent(`Dear VLE (${d.name}), You have done ${d.tx25} REDBUS transactions last year. Please login to CSC portal and start doing REDBUS bookings for this year to achieve your target.`);
                let waLink = d.mobile.length >= 10 ? `https://wa.me/91${d.mobile}?text=${waMsg}` : `#`;
                let btnHtml = d.status === "PENDING" ? `<a href="${waLink}" target="_blank" class="btn-wa">💬 Send Alert</a>` : `<span style="color:#15803d; font-size:11.5px; font-weight:800;">✔️ Done</span>`;

                tbody.innerHTML += `
                <tr>
                    <td class="td-dist ps-3">${d.dist}</td>
                    <td class="vle-name ps-3">${d.name}</td>
                    <td class="csc-id">${d.cscId}</td>
                    <td style="color:var(--muted);">${d.mobile}</td>
                    <td style="color:#7c4a12; font-weight:900;">${d.tx25}</td>
                    <td style="color:${d.tx26 > 0 ? '#15803d' : '#b91c1c'}; font-weight:900;">${d.tx26}</td>
                    <td><span class="${statClass}">${d.status}</span></td>
                    <td>${btnHtml}</td>
                </tr>`;
                
                renderCount++;
            }
        });

        if(dataArray.length > displayLimit) {
            tbody.innerHTML += `<tr><td colspan="8" style="color:var(--muted); padding:10px; text-align:center; font-size:11.5px; font-weight:700;">Showing top ${displayLimit} records. Please use filters to see more.</td></tr>`;
        }
    }

    function exportToExcel() {
       let ws = XLSX.utils.json_to_sheet(currentTableData.map(d => ({
           "DISTRICT": d.dist, "VLE NAME": d.name, "CSC ID": d.cscId, "MOBILE NO": d.mobile,
           "FY 25-26 TXNS": d.tx25, "FY 26-27 TXNS": d.tx26, "STATUS": d.status
       })));
       let wb = XLSX.utils.book_new();
       XLSX.utils.book_append_sheet(wb, ws, "Priority Follow Up");
       let dStr = ("0" + new Date().getDate()).slice(-2) + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2) + "-" + new Date().getFullYear();
       XLSX.writeFile(wb, `REDBUS_Priority_FollowUp_${dStr}.xlsx`);
    }

    function downloadImage() {
       document.documentElement.classList.add("exporting");
       let captureArea = document.getElementById('captureArea');
       
       setTimeout(() => {
           html2canvas(captureArea, {
              scale: 2,
              useCORS: true,
              backgroundColor: "#faf8f2",
              width: captureArea.offsetWidth,
              height: captureArea.offsetHeight,
              windowWidth: captureArea.offsetWidth
           }).then(canvas => {
              document.documentElement.classList.remove("exporting");
              let link = document.createElement('a');
              let dStr = ("0" + new Date().getDate()).slice(-2) + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2) + "-" + new Date().getFullYear();
              link.download = `REDBUS_Priority_FollowUp_${dStr}.png`;
              link.href = canvas.toDataURL("image/png");
              link.click();
           }).catch(err => {
              console.error("Image capture failed:", err);
              document.documentElement.classList.remove("exporting");
           });
       }, 350); 
    }
  </script>
</body>
</html>
