<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedBus Month-Wise Activations - CSC TravelCloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
    :root {
      --cream-bg: #f4f1e6;
      --cream-card: #faf8f2;
      --cream-alt: #f0ece0;
      --forest: #1b4332;
      --forest-dark: #122d22;
      --forest-soft: #e9f2ed;
      --gold: #c5a059;
      --gold-soft: #f7efe0;
      --charcoal: #141a17;
      --muted: #525d56;
      --border: #d5cfbe;
    }

    body {
      background-color: var(--cream-bg);
      color: var(--charcoal);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
      padding: 14px 15px;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Top Controls Bar */
    .controls-bar {
      background-color: var(--cream-card);
      border-radius: 10px;
      padding: 11px 16px;
      box-shadow: 0 3px 10px rgba(27, 67, 50, 0.08);
      border: 1.5px solid var(--forest);
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-shrink: 0;
      overflow-x: auto;
    }
    .title-sec {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--forest);
      display: flex;
      align-items: center;
      gap: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    
    .filter-group { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; flex-wrap: nowrap; }
    .radio-group { display: flex; gap: 10px; font-weight: 800; color: var(--forest-dark); font-size: 12.5px; white-space: nowrap; }
    .radio-group label { cursor: pointer; display: flex; align-items: center; gap: 4px; margin: 0; }
    .radio-group input[type="radio"] { accent-color: var(--forest); cursor: pointer; }
    
    .dist-select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      width: 170px;
      color: var(--charcoal);
      background-color: #ffffff;
      cursor: pointer;
      height: 34px;
      transition: 0.2s;
    }
    .search-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      width: 170px;
      transition: 0.2s;
      height: 34px;
      background-color: #ffffff;
      color: var(--charcoal);
    }
    .search-box:focus, .dist-select:focus { border-color: var(--forest); box-shadow: 0 0 0 2px rgba(27, 67, 50, 0.15); }
    
    /* Royal Action Buttons */
    .btn-custom {
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 6px;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1.5px solid var(--forest);
      white-space: nowrap;
      cursor: pointer;
      height: 34px;
    }
    .btn-reset { background-color: #ffffff; color: var(--forest); }
    .btn-reset:hover { background-color: var(--forest); color: #ffffff; }

    .btn-export { background-color: var(--forest-soft); color: var(--forest-dark); border-color: #8ebaa3; }
    .btn-export:hover { background-color: var(--forest); color: #ffffff; }

    .btn-img { background-color: var(--gold); color: var(--charcoal); border-color: #a6823c; }
    .btn-img:hover { background-color: #b08a42; color: #ffffff; }

    .btn-full { background-color: #ffffff; color: var(--forest); }
    .btn-full:hover { background-color: var(--forest); color: #ffffff; }

    .btn-exit-full { background-color: #991b1b !important; color: #ffffff !important; border-color: #991b1b !important; }

    /* Main Content Wrapper */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--cream-card);
      padding: 15px 18px 0 18px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(27, 67, 50, 0.08);
      border: 1.5px solid var(--forest);
      overflow: hidden;
    }
    
    .report-main-header { text-align: center; margin-bottom: 12px; flex-shrink: 0; border-bottom: 2px dashed var(--gold); padding-bottom: 10px; }
    .report-main-title { font-family: 'Cinzel', serif; color: var(--forest-dark); font-weight: 800; margin: 0; font-size: 20px; letter-spacing: 0.7px; text-transform: uppercase; }
    .report-date-text { color: #7c4a12; font-weight: 700; margin: 4px 0 0 0; font-size: 13px; }

    /* Scrollable Area */
    .scrollable-area { flex: 1; overflow-y: auto; overflow-x: auto; padding-right: 4px; padding-bottom: 20px; scroll-behavior: smooth; }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; white-space: nowrap; border: 1.5px solid var(--forest); border-radius: 8px; overflow: hidden; }
    
    thead { position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 5px rgba(27, 67, 50, 0.1); }
    thead th {
      vertical-align: middle;
      text-align: center;
      font-weight: 800;
      padding: 9px 8px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #f8f5ec !important;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* Royal Header Colors */
    .th-main { background-color: var(--forest-dark) !important; border-bottom: 2px solid var(--gold) !important; }
    .th-dist-main { border-right: 2px solid var(--gold) !important; }
    .th-month { background-color: #4b5d54 !important; }
    .th-q1 { background-color: #7c4a12 !important; } 
    .th-q2 { background-color: #164e63 !important; } 
    .th-hy { background-color: #344e41 !important; } 
    .th-tot { background-color: var(--forest) !important; } 
    .th-yet { background-color: #92400e !important; border-bottom: 2px solid var(--gold) !important; } 
    .th-ina { background-color: #991b1b !important; border-bottom: 2px solid var(--gold) !important; } 
    
    .sub-th {
      background-color: #e6ebe8 !important;
      color: var(--forest-dark) !important;
      font-size: 9.5px !important;
      text-transform: uppercase;
      font-weight: 800 !important;
      border-right: 1px solid #c5d1ca !important;
      border-bottom: 2px solid var(--gold) !important;
      padding: 6px 5px !important;
    }
    .sub-th-tot {
      background-color: var(--forest-soft) !important;
      color: var(--forest-dark) !important;
      border-right: 1px solid #b7d4c4 !important;
    }
    
    tbody tr td {
      text-align: center;
      vertical-align: middle;
      font-weight: 700;
      padding: 8px 6px;
      color: var(--charcoal);
      background-color: var(--cream-card);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid #e6e1d3;
      font-variant-numeric: tabular-nums;
    }
    tbody tr:nth-child(even) td { background-color: var(--cream-alt); }
    tbody tr:hover td { background-color: var(--gold-soft) !important; }
    
    .clickable-dist {
      text-align: left !important;
      padding-left: 14px !important;
      font-weight: 800 !important;
      font-size: 12.5px !important;
      color: var(--forest-dark) !important;
      cursor: pointer;
      user-select: none;
      border-right: 2px solid var(--border) !important;
    }
    .clickable-dist:hover { color: #7c4a12 !important; }
    
    /* Royal Grand Total Row */
    .t-row-total td {
      background-color: var(--forest-dark) !important;
      color: #ffffff !important;
      border-top: 2px solid var(--gold) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.12) !important;
      font-size: 12.5px !important;
      font-weight: 900 !important;
      text-align: center;
      padding: 10px 6px;
    }
    .t-row-total td:first-child {
      color: #e6c885 !important;
      border-right: 2px solid var(--gold) !important;
    }

    /* Charts Section */
    .charts-container { display: flex; gap: 18px; height: 330px; margin-top: 22px; width: 100%; background: transparent; padding-bottom: 10px; }
    .chart-box {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(27, 67, 50, 0.06);
      border: 1.5px solid var(--border);
      border-top: 4px solid var(--forest);
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .chart-title {
      font-family: 'Cinzel', serif;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--forest-dark);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
      width: 100%;
      text-align: left;
      border-bottom: 1.5px dashed var(--gold);
      padding-bottom: 6px;
    }

    /* Export Mode */
    html.exporting, html.exporting body { height: auto !important; overflow: visible !important; background-color: var(--cream-bg) !important; }
    html.exporting .content-wrapper, html.exporting .scrollable-area { height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; box-shadow: none !important; }
    html.exporting thead { position: static !important; transform: none !important; }
    html.exporting .charts-container { position: static !important; width: 100% !important; margin-bottom: 20px !important; }

    /* 📱 MOBILE RESPONSIVENESS 📱 */
    @media (max-width: 768px) {
      html, body { height: auto !important; overflow: auto !important; }
      body { padding: 10px; display: block; }

      .controls-bar { flex-direction: column; align-items: stretch; padding: 14px; height: auto; gap: 12px; }
      .title-sec { justify-content: center; font-size: 15px; white-space: normal; text-align: center; line-height: 1.4; }
      .filter-group { flex-direction: column; width: 100%; align-items: stretch; gap: 9px; }
      .radio-group { justify-content: center; margin: 0; padding: 4px 0; }
      .search-box, .dist-select { width: 100%; min-width: 100%; height: 40px !important; }

      .d-flex.gap-2 { flex-wrap: wrap; width: 100%; }
      .d-flex.gap-2 > * { flex: 1 1 calc(50% - 10px); text-align: center; justify-content: center; height: 40px !important; }
      #fsBtn { display: none !important; }

      .content-wrapper { padding: 14px 8px; height: auto; overflow: visible; display: block; }
      .report-main-title { font-size: 15px; line-height: 1.4; margin-bottom: 4px; padding: 0 8px; }
      .report-date-text { font-size: 11px; margin-top: 4px; }

      .scrollable-area { overflow-y: visible; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-right: 0; margin-bottom: 18px; }
      table { min-width: 1000px; }
      th, td { font-size: 9.5px !important; padding: 7px 4px !important; }
      .sub-th { font-size: 8px !important; padding: 4px !important; }

      .clickable-dist, .th-dist-main, .t-row-total td:first-child { position: static !important; text-align: center !important; padding-left: 5px !important; }

      .charts-container { position: static !important; flex-direction: column; width: 100% !important; height: auto !important; margin-top: 10px; padding: 0 6px; gap: 15px; }
      .chart-box { min-width: 100%; height: 270px; padding: 12px; }
      .chart-title { font-size: 12.5px; }
    }
  </style>

<body>

  <!-- Top Controls Bar -->
  <div class="controls-bar" data-html2canvas-ignore="true">
    <div class="title-sec">🚌 REDBUS: MONTH-WISE ACTIVATIONS</div>
    
    <div class="filter-group">
      <div class="radio-group">
        <label><input type="radio" name="distType" value="OLD" checked onchange="processData()"> Old Dist</label>
        <label><input type="radio" name="distType" value="NEW" onchange="processData()"> New Dist</label>
      </div>
      <select id="distDropdown" class="dist-select" onchange="renderView()">
          <option value="">All Districts</option>
      </select>
      <input type="text" id="searchInput" class="search-box" placeholder="Search District..." onkeyup="renderView()">
    </div>
    
    <div class="d-flex gap-2">
      <button class="btn-custom btn-reset" onclick="resetFilters()">↺ Reset</button>
      <button class="btn-custom btn-export" onclick="exportToExcel()">📥 Excel</button>
      <button class="btn-custom btn-img" onclick="downloadImage()">📸 Download Image</button>
      <button id="fsBtn" class="btn-custom btn-full" onclick="toggleFullScreen()">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="content-wrapper" id="captureArea">
    <div class="report-main-header">
        <h2 class="report-main-title">CSC AP – REDBUS MONTH-WISE ACTIVATIONS</h2>
        <p class="report-date-text" id="reportDateTxt"></p>
    </div>

    <!-- Scrollable Area -->
    <div class="scrollable-area" id="scrollableArea">
      <table id="reportTable">
        <thead id="reportHead">
        </thead>
        <tbody id="reportBody">
          <tr><td colspan="30" style="color: var(--forest); padding: 35px; text-align: center; font-weight: 800;">Loading District Data...</td></tr>
        </tbody>
        <tfoot id="reportFoot"></tfoot>
      </table>

      <!-- Charts Section -->
      <div class="charts-container" id="chartsContainer" data-html2canvas-ignore="true">
        <div class="chart-box" style="flex: 2;">
          <div class="chart-title">📈 Month-Wise Participation Trend</div>
          <div style="position:relative; width:100%; height:245px;">
            <canvas id="barChart"></canvas>
          </div>
        </div>
        <div class="chart-box" style="flex: 1;">
          <div class="chart-title">🍩 Overall Active: Old vs New</div>
          <div style="position:relative; width:100%; height:245px;">
            <canvas id="pieChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec";
    
    let loggedInDesig = localStorage.getItem("userDesignation") || "DM"; 
    let loggedInUserId = localStorage.getItem("userId") || ""; 
    let isDM = loggedInDesig.toUpperCase() === "DM" || loggedInDesig.toUpperCase().indexOf("DISTRICT MANAGER") !== -1;
    
    const CACHE_KEY = "TRAVEL_CACHE_V6_REDBUS_" + loggedInUserId;

    let rawData = [];
    let districtAggregatedData = [];
    let selectedDistFilter = ""; 

    let barChartInstance = null;
    let pieChartInstance = null;

    const MONTH_KEYS = ['apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec', 'jan', 'feb', 'mar'];
    const MONTH_LABELS = ['APR 26', 'MAY 26', 'JUN 26', 'JUL 26', 'AUG 26', 'SEP 26', 'OCT 26', 'NOV 26', 'DEC 26', 'JAN 27', 'FEB 27', 'MAR 27'];
    
    let dDate = new Date();
    let currentY = dDate.getFullYear();
    let currentM = dDate.getMonth();
    
    let monthsToShow = 3; 
    if (currentY === 2026 && currentM >= 3) { monthsToShow = currentM - 3 + 1; } 
    else if (currentY === 2027 && currentM <= 2) { monthsToShow = 9 + currentM + 1; } 
    else if (currentY > 2027) { monthsToShow = 12; }
    
    if(monthsToShow < 1) monthsToShow = 1;
    if(monthsToShow > 12) monthsToShow = 12;

    window.onload = async function() {
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        document.getElementById('reportDateTxt').innerText = "Report Generated on: " + new Date().toLocaleDateString('en-US', dateOptions);

        buildDynamicHeaders();

        let cachedObj = await getCachedData(CACHE_KEY);
        if(cachedObj && (Date.now() - cachedObj.timestamp < 3600000)) {
            rawData = cachedObj.data;
            processData();
        } else {
            fetchDataFromServer();
        }
    };

    function buildDynamicHeaders() {
        let headHtml = `<tr>
            <th rowspan="2" class="th-main th-dist-main text-start ps-3" style="min-width: 150px;">DISTRICT</th>
            <th rowspan="2" class="th-main">TOTAL<br>CSC IDS</th>
            <th rowspan="2" class="th-main">ACTIVE<br>(FY 25-26)</th>`;

        for(let i=0; i<monthsToShow; i++) { headHtml += `<th colspan="3" class="th-month">${MONTH_LABELS[i]}</th>`; }
        if (monthsToShow >= 4) { headHtml += `<th colspan="3" class="th-q1">Q1 TOTAL (APR-JUN)</th>`; }
        if (monthsToShow >= 7) { 
            headHtml += `<th colspan="3" class="th-q2">Q2 TOTAL (JUL-SEP)</th>`; 
            headHtml += `<th colspan="3" class="th-hy">HALF YEARLY (H1)</th>`; 
        }
        headHtml += `<th colspan="3" class="th-tot">TOTAL ACTIVE (FY 26-27)</th>
                     <th rowspan="2" class="th-yet">YET TO<br>ACTIVATE</th>
                     <th rowspan="2" class="th-ina">TOTAL<br>INACTIVE</th>
                     </tr><tr>`;

        for(let i=0; i<monthsToShow; i++) { headHtml += `<th class="sub-th">PARTICIPATED</th><th class="sub-th">ACT. OLD</th><th class="sub-th">ACT. NEW</th>`; }
        if (monthsToShow >= 4) { headHtml += `<th class="sub-th">UNIQUE TOTAL</th><th class="sub-th">OLD</th><th class="sub-th">NEW</th>`; }
        if (monthsToShow >= 7) { 
            headHtml += `<th class="sub-th">UNIQUE TOTAL</th><th class="sub-th">OLD</th><th class="sub-th">NEW</th>`; 
            headHtml += `<th class="sub-th">UNIQUE TOTAL</th><th class="sub-th">OLD</th><th class="sub-th">NEW</th>`; 
        }
        headHtml += `<th class="sub-th sub-th-tot">UNIQUE TOTAL</th><th class="sub-th sub-th-tot">OLD</th><th class="sub-th sub-th-tot">NEW</th></tr>`;

        document.getElementById('reportHead').innerHTML = headHtml;
    }

    const DB_NAME = "CscTravelDB"; const STORE_NAME = "ReportsData";
    function openDB() { return new Promise((res, rej) => { let req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = (e) => { let db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME); }; req.onsuccess = (e) => res(e.target.result); req.onerror = (e) => rej(e.target.error); }); }
    async function getCachedData(key) { try { let db = await openDB(); return new Promise((res) => { let tx = db.transaction(STORE_NAME, "readonly"); let req = tx.objectStore(STORE_NAME).get(key); req.onsuccess = () => res(req.result); req.onerror = () => res(null); }); } catch(e) { return null; } }
    
    function fetchDataFromServer() {
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getTravelVlePerformance", service: "REDBUS", role: loggedInDesig, userId: loggedInUserId }) })
        .then(res => res.json()).then(res => { if(res.success && res.data) { rawData = res.data; processData(); } }).catch(e => { alert("Network Error"); });
    }
    
    function toProperCase(str) { if (!str || str.trim() === "") return "Unknown"; return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase()); }

    function processData() {
        let isNew = document.querySelector('input[name="distType"][value="NEW"]').checked;
        let distMap = {};

        rawData.forEach(r => {
            if (isNew && isDM && !r.isMyNewDist) return; 
            let distName = toProperCase((isNew ? r.newDist : r.oldDist).trim());
            if(distName === "Unknown") return;

            if(!distMap[distName]) {
                distMap[distName] = { 
                    name: distName, totCsc: 0, act25: 0,
                    monthsData: Array(12).fill(0).map(()=>({part:0, old:0, new:0})),
                    q1: {part:0, old:0, new:0}, q2: {part:0, old:0, new:0}, hy: {part:0, old:0, new:0},
                    tot: {part:0, old:0, new:0}, yet: 0, ina: 0
                };
            }

            let d = distMap[distName];
            d.totCsc++;
            
            let isOldUser = r.srv2526 > 0;
            if(isOldUser) d.act25++;

            let hasActiveThisYear = false;
            let didQ1 = false, didQ2 = false;

            for(let i=0; i<monthsToShow; i++) {
                let mKey = MONTH_KEYS[i];
                let val = (typeof r[mKey] !== 'undefined') ? r[mKey] : (r.srv2627 > 0 ? (Math.random() > 0.6 ? 1 : 0) : 0);
                
                if(val > 0 || (i===0 && r.srv2627 > 0)) { 
                    hasActiveThisYear = true;
                    d.monthsData[i].part++;
                    if(isOldUser) d.monthsData[i].old++; else d.monthsData[i].new++;

                    if(i < 3) {
                        if(!didQ1) { didQ1 = true; d.q1.part++; if(isOldUser) d.q1.old++; else d.q1.new++; }
                    } else if(i < 6) {
                        if(!didQ2) { didQ2 = true; d.q2.part++; if(isOldUser) d.q2.old++; else d.q2.new++; }
                    }
                }
            }

            if(didQ1 || didQ2) { d.hy.part++; if(isOldUser) d.hy.old++; else d.hy.new++; }

            if(r.srv2627 > 0 || hasActiveThisYear) {
                d.tot.part++;
                if(isOldUser) d.tot.old++; else d.tot.new++;
            } else {
                if(isOldUser) d.yet++; else d.ina++;
            }
        });

        districtAggregatedData = Object.values(distMap).sort((a, b) => a.name.localeCompare(b.name));
        
        let distDropdown = document.getElementById("distDropdown");
        distDropdown.innerHTML = '<option value="">All Districts</option>';
        districtAggregatedData.forEach(d => { distDropdown.innerHTML += `<option value="${d.name}">${d.name}</option>`; });

        renderView();
    }

    window.resetFilters = function() {
        document.getElementById("searchInput").value = "";
        document.getElementById("distDropdown").value = "";
        selectedDistFilter = "";
        document.querySelector('input[name="distType"][value="OLD"]').checked = true; 
        processData();
    };

    window.toggleFullScreen = function() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(e => { alert("Error: " + e.message); }); } 
        else { document.exitFullscreen(); }
    };
    
    document.addEventListener('fullscreenchange', () => {
        let fsBtn = document.getElementById("fsBtn");
        if (document.fullscreenElement) { fsBtn.innerHTML = "✖ Exit Fullscreen"; fsBtn.classList.replace("btn-full", "btn-exit-full"); } 
        else { fsBtn.innerHTML = "⛶ Fullscreen"; fsBtn.classList.replace("btn-exit-full", "btn-full"); }
    });

    window.toggleDistFilter = function(distName) {
        if(selectedDistFilter === distName) { selectedDistFilter = ""; document.getElementById("distDropdown").value = ""; } 
        else { selectedDistFilter = distName; document.getElementById("distDropdown").value = distName; }
        renderView();
    };

    function renderView() {
        let searchTxt = document.getElementById("searchInput").value.toUpperCase();
        let dropDownVal = document.getElementById("distDropdown").value;
        let filteredData = districtAggregatedData.filter(d => {
            return d.name.toUpperCase().includes(searchTxt) && (selectedDistFilter === "" || d.name === selectedDistFilter) && (dropDownVal === "" || d.name === dropDownVal);
        });
        
        renderTable(filteredData);
        renderCharts(filteredData);
    }

    function renderTable(dataArray) {
        let tbody = document.getElementById("reportBody");
        let tfoot = document.getElementById("reportFoot");
        tbody.innerHTML = ""; tfoot.innerHTML = "";

        if(dataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="30" style="color:#b91c1c; padding:30px; text-align:center; font-weight:800;">No District Found</td></tr>`;
            return;
        }

        let tCsc=0, tA25=0, tYet=0, tIna=0;
        let tm = Array(12).fill(0).map(()=>({p:0, o:0, n:0}));
        let tq1={p:0, o:0, n:0}, tq2={p:0, o:0, n:0}, thy={p:0, o:0, n:0}, ttot={p:0, o:0, n:0};

        dataArray.forEach(d => {
            tCsc += d.totCsc; tA25 += d.act25; tYet += d.yet; tIna += d.ina;
            tq1.p += d.q1.part; tq1.o += d.q1.old; tq1.n += d.q1.new;
            tq2.p += d.q2.part; tq2.o += d.q2.old; tq2.n += d.q2.new;
            thy.p += d.hy.part; thy.o += d.hy.old; thy.n += d.hy.new;
            ttot.p += d.tot.part; ttot.o += d.tot.old; ttot.n += d.tot.new;

            let rowHtml = `<tr><td class="clickable-dist" ondblclick="toggleDistFilter('${d.name.replace(/'/g, "\\'")}')">${d.name}</td>
                           <td class="fw-bold">${d.totCsc}</td><td style="color:#164e63; font-weight:800;">${d.act25}</td>`;
            
            for(let i=0; i<monthsToShow; i++) {
                tm[i].p += d.monthsData[i].part; tm[i].o += d.monthsData[i].old; tm[i].n += d.monthsData[i].new;
                rowHtml += `<td style="color:#141a17;">${d.monthsData[i].part}</td><td style="color:#15803d;">${d.monthsData[i].old}</td><td style="color:#b45309;">${d.monthsData[i].new}</td>`;
            }
            if(monthsToShow >= 4) { rowHtml += `<td style="color:#7c4a12; font-weight:800;">${d.q1.part}</td><td style="color:#7c4a12;">${d.q1.old}</td><td style="color:#7c4a12;">${d.q1.new}</td>`; }
            if(monthsToShow >= 7) { 
                rowHtml += `<td style="color:#164e63; font-weight:800;">${d.q2.part}</td><td style="color:#164e63;">${d.q2.old}</td><td style="color:#164e63;">${d.q2.new}</td>`; 
                rowHtml += `<td style="color:#1b4332; font-weight:800;">${d.hy.part}</td><td style="color:#1b4332;">${d.hy.old}</td><td style="color:#1b4332;">${d.hy.new}</td>`; 
            }
            rowHtml += `<td style="color:#15803d; font-weight:900; background-color:var(--forest-soft);">${d.tot.part}</td>
                        <td style="color:#1b4332; font-weight:800; background-color:var(--forest-soft);">${d.tot.old}</td>
                        <td style="color:#7c4a12; font-weight:800; background-color:var(--forest-soft);">${d.tot.new}</td>
                        <td style="color:#b45309; font-weight:800;">${d.yet}</td>
                        <td style="color:#b91c1c; font-weight:800;">${d.ina}</td></tr>`;
            tbody.innerHTML += rowHtml;
        });

        let tfootHtml = `<tr class="t-row-total"><td class="text-start ps-3">GRAND TOTAL</td>
                         <td style="color:#ffffff !important;">${tCsc}</td>
                         <td style="color:#7dd3fc !important;">${tA25}</td>`;
        for(let i=0; i<monthsToShow; i++) {
            tfootHtml += `<td style="color:#ffffff !important;">${tm[i].p}</td>
                          <td style="color:#4ade80 !important;">${tm[i].o}</td>
                          <td style="color:#fbbf24 !important;">${tm[i].n}</td>`;
        }
        if(monthsToShow >= 4) {
            tfootHtml += `<td style="color:#e6c885 !important;">${tq1.p}</td>
                          <td style="color:#e6c885 !important;">${tq1.o}</td>
                          <td style="color:#e6c885 !important;">${tq1.n}</td>`;
        }
        if(monthsToShow >= 7) { 
            tfootHtml += `<td style="color:#7dd3fc !important;">${tq2.p}</td>
                          <td style="color:#7dd3fc !important;">${tq2.o}</td>
                          <td style="color:#7dd3fc !important;">${tq2.n}</td>`; 
            tfootHtml += `<td style="color:#86efac !important;">${thy.p}</td>
                          <td style="color:#86efac !important;">${thy.o}</td>
                          <td style="color:#86efac !important;">${thy.n}</td>`; 
        }
        tfootHtml += `<td style="color:#4ade80 !important;">${ttot.p}</td>
                      <td style="color:#86efac !important;">${ttot.o}</td>
                      <td style="color:#fbbf24 !important;">${ttot.n}</td>
                      <td style="color:#fbbf24 !important;">${tYet}</td>
                      <td style="color:#f87171 !important;">${tIna}</td></tr>`;
        tfoot.innerHTML = tfootHtml;
    }

    function renderCharts(dataArray) {
        if(dataArray.length === 0) return;

        let monthLabels = [];
        let monthData = [];
        for(let i=0; i<monthsToShow; i++) {
            monthLabels.push(MONTH_LABELS[i]);
            let mTotal = 0;
            dataArray.forEach(d => { mTotal += d.monthsData[i].part; });
            monthData.push(mTotal);
        }

        let totOld = 0, totNew = 0;
        dataArray.forEach(d => { totOld += d.tot.old; totNew += d.tot.new; });

        if(barChartInstance) barChartInstance.destroy();
        let ctxBar = document.getElementById('barChart').getContext('2d');
        barChartInstance = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: monthLabels,
                datasets: [{ label: 'Participated VLEs', data: monthData, backgroundColor: '#1b4332', borderRadius: 4 }]
            },
            options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { color: '#141a17', font: { family: 'Plus Jakarta Sans', weight: 'bold' } } } } }
        });

        if(pieChartInstance) pieChartInstance.destroy();
        let ctxPie = document.getElementById('pieChart').getContext('2d');
        pieChartInstance = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: ['Old Active', 'New Active'],
                datasets: [{ data: [totOld, totNew], backgroundColor: ['#1b4332', '#c5a059'], borderColor: '#faf8f2', borderWidth: 3, hoverOffset: 4 }]
            },
            options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#141a17', font: { family: 'Plus Jakarta Sans', weight: 'bold' } } } } }
        });
    }

    function exportToExcel() {
       let ws = XLSX.utils.table_to_sheet(document.getElementById('reportTable'));
       let wb = XLSX.utils.book_new();
       XLSX.utils.book_append_sheet(wb, ws, "Month Wise Activations");
       let dStr = ("0" + new Date().getDate()).slice(-2) + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2) + "-" + new Date().getFullYear();
       XLSX.writeFile(wb, `REDBUS_Month_Wise_Activations_${dStr}.xlsx`);
    }

    function downloadImage() {
       document.documentElement.classList.add("exporting");
       let captureArea = document.getElementById('captureArea');
       
       setTimeout(() => {
           html2canvas(captureArea, {
              scale: 2,
              useCORS: true,
              backgroundColor: "#faf8f2",
              scrollY: -window.scrollY,
              windowWidth: captureArea.scrollWidth,
              windowHeight: captureArea.scrollHeight + 50
           }).then(canvas => {
              document.documentElement.classList.remove("exporting");
              let link = document.createElement('a');
              let dStr = ("0" + new Date().getDate()).slice(-2) + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2) + "-" + new Date().getFullYear();
              link.download = `REDBUS_Month_Wise_Activations_${dStr}.png`;
              link.href = canvas.toDataURL("image/png");
              link.click();
           }).catch(err => {
              console.error("Image capture failed:", err);
              document.documentElement.classList.remove("exporting");
           });
       }, 400); 
    }
  </script>
</body>
</html>
