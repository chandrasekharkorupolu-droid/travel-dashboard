<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLE Details - AP Tour & Travels</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

  <style>
    /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
    :root {
      --cream-bg: #f4f1e6;
      --cream-card: #faf8f2;
      --cream-alt: #f0ece0;
      --forest: #1b4332;
      --forest-dark: #122d22;
      --forest-soft: #e9f2ed;
      --gold: #c5a059;
      --gold-light: #e6c885;
      --gold-hover: #a6823c;
      --gold-soft: #f7efe0;
      --charcoal: #141a17;
      --muted: #525d56;
      --border: #d5cfbe;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--cream-bg);
      color: var(--charcoal);
      padding: 16px;
      margin: 0;
      min-height: 100vh;
    }
    
    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 19px;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
      padding: 13px 20px;
      border-radius: 12px;
      border: 1.5px solid var(--forest-dark);
      border-bottom: 4px solid var(--gold);
      box-shadow: 0 4px 14px rgba(18, 45, 34, 0.16);
    }

    .sync-btn-top {
      margin-left: auto;
      background: var(--gold);
      color: var(--charcoal);
      border: 1.5px solid var(--gold-hover);
      padding: 7px 14px;
      border-radius: 7px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      text-transform: none;
      letter-spacing: 0;
    }
    .sync-btn-top:hover { background: var(--gold-light); color: var(--forest-dark); transform: translateY(-1px); }
    
    .search-card {
      background: var(--cream-card);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(27, 67, 50, 0.06);
      border: 1.5px solid var(--forest);
      border-top: 4px solid var(--gold);
      margin-bottom: 14px;
    }
    
    .search-row { display: flex; flex-wrap: nowrap; gap: 12px; align-items: flex-end; width: 100%; }
    
    .input-col { flex: 1.5; display: flex; flex-direction: column; gap: 5px; }
    .input-col label {
      font-size: 11px;
      font-weight: 800;
      color: var(--forest-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .custom-input {
      height: 40px;
      padding: 0 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      outline: none;
      transition: 0.2s;
      width: 100%;
      box-sizing: border-box;
      color: var(--charcoal);
      background: #ffffff;
    }
    .custom-input:focus {
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.14);
    }
    
    .or-divider { font-weight: 800; color: #7c4a12; padding-bottom: 11px; font-size: 12px; flex: 0; white-space: nowrap; }

    .action-buttons { display: flex; gap: 8px; flex: 1; }
    .search-btn {
      background: linear-gradient(135deg, var(--forest), var(--forest-dark));
      color: #f8f5ec;
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      height: 40px;
      flex: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-btn:hover { background: var(--gold); color: var(--charcoal); border-color: var(--gold-hover); }
    
    .reset-btn {
      background: #ffffff;
      color: var(--forest);
      border: 1.5px solid var(--forest);
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      height: 40px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reset-btn:hover { background: var(--forest); color: #ffffff; }

    .action-toolbar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--cream-card);
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(27, 67, 50, 0.06);
      border: 1.5px solid var(--forest);
      margin-bottom: 14px;
      gap: 14px;
      animation: fadeIn 0.3s ease-out;
    }
    
    .live-search-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      border: 1.5px solid var(--border);
      padding: 0 12px;
      border-radius: 8px;
      height: 36px;
      background: #ffffff;
      transition: 0.2s;
    }
    .live-search-wrapper:focus-within { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.12); }
    .live-search-input { border: none; outline: none; font-size: 13px; font-weight: 600; color: var(--charcoal); background: transparent; width: 100%; }
    
    .result-stats {
      font-weight: 800;
      color: var(--forest-dark);
      font-size: 12.5px;
      white-space: nowrap;
      background: var(--gold-soft);
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--gold);
    }
    
    .download-btn {
      background: var(--gold);
      color: var(--charcoal);
      border: 1.5px solid var(--gold-hover);
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      transition: 0.2s;
      height: 36px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    .download-btn:hover { background: var(--forest); color: #f8f5ec; border-color: var(--forest-dark); }

    .table-container {
      background: var(--cream-card);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(27, 67, 50, 0.08);
      border: 1.5px solid var(--forest);
      overflow: hidden;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }
    .table-wrapper { overflow-x: auto; max-height: calc(100vh - 230px); } 
    
    .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; min-width: 900px; font-size: 12.5px; }
    .custom-table thead { position: sticky; top: 0; background: var(--forest); z-index: 10; }
    .custom-table th {
      padding: 12px;
      color: #f8f5ec;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--gold);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
    }
    .custom-table th:last-child { border-right: none; }
    .custom-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid #e6e1d3;
      font-weight: 600;
      color: var(--charcoal);
      background-color: var(--cream-card);
      vertical-align: middle;
    }
    
    .custom-table tbody tr:nth-child(even) td { background-color: var(--cream-alt); }
    .custom-table tbody tr:hover td { background-color: var(--gold-soft) !important; }

    .badge-csc {
      background: var(--forest-soft);
      padding: 4px 9px;
      border-radius: 6px;
      font-weight: 800;
      border: 1px solid #a7ccb8;
      color: var(--forest-dark);
      display: inline-block;
      font-size: 11.5px;
    }
    .text-vle { color: var(--forest-dark); font-weight: 800; font-size: 13px; }
    .text-dm { color: #7c4a12; font-weight: 800; }

    .copyable { cursor: pointer; transition: background-color 0.2s ease; }
    .copyable:hover { background-color: var(--gold-soft) !important; }

    #vleSearchLoader { display: none; text-align: center; padding: 34px; color: var(--forest); }
    .loader-text { font-size: 13.5px; font-weight: 700; margin-top: 10px; color: var(--forest-dark); }
    
    .copy-toast {
      visibility: hidden;
      min-width: 250px;
      background-color: var(--forest-dark);
      color: var(--gold-light);
      border: 1.5px solid var(--gold);
      text-align: center;
      border-radius: 50px;
      padding: 11px 20px;
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
    }
    .copy-toast.show { visibility: visible; opacity: 1; bottom: 50px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 992px) {
      .header-title { font-size: 16px; padding: 12px 14px; flex-wrap: wrap; gap: 10px; }
      .search-row { flex-direction: column; align-items: stretch; gap: 12px; }
      .or-divider { text-align: center; padding-bottom: 0; }
      .action-buttons { flex-direction: row; }
      .action-toolbar { flex-direction: column; align-items: stretch; }
      
      .table-container { background: transparent; border: none; box-shadow: none; }
      .table-wrapper { max-height: none; overflow-x: hidden; }
      .custom-table, .custom-table tbody { display: block; width: 100%; min-width: auto; }
      .custom-table thead { display: none; }
      
      .custom-table tr {
        display: block;
        margin-bottom: 14px;
        border: 1.5px solid var(--forest);
        border-top: 4px solid var(--gold);
        border-radius: 10px;
        padding: 5px 14px;
        background: var(--cream-card);
        box-shadow: 0 4px 10px rgba(27, 67, 50, 0.08);
      }
      .custom-table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-right: none;
        border-bottom: 1px dashed var(--border);
        padding: 10px 0;
        text-align: right;
        background: transparent !important;
      }
      .custom-table td:last-child { border-bottom: none; }
      .custom-table td::before {
        content: attr(data-label);
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 10.5px;
        text-align: left;
        margin-right: 15px;
      }
      .custom-table td[data-label="S.No"] {
        justify-content: center;
        background: var(--forest) !important;
        border-radius: 6px 6px 0 0;
        margin: -5px -14px 4px -14px;
        padding: 8px;
        color: var(--gold-light) !important;
        border-bottom: 2px solid var(--gold);
        font-size: 13.5px;
        font-weight: 800;
      }
      .custom-table td[data-label="S.No"]::before { display: none; }
    }
  </style>
</head>
<body>

    <div class="header-title">
        <span><i class="fa-solid fa-users-viewfinder me-2" style="color: var(--gold);"></i> VLE Master List</span>
        <button class="sync-btn-top" onclick="forceRefreshData()" title="Fetch fresh data from server">
            <i class="fa-solid fa-rotate me-1"></i> Sync Latest Data
        </button>
    </div>
    
    <div class="search-card">
        <div class="search-row">
            <div class="input-col">
                <label>VLE CSC ID</label>
                <input type="text" id="searchCscId" class="custom-input" placeholder="e.g. 123456789012" oninput="clearDistrict()">
            </div>
            
            <div class="or-divider">(OR)</div>

            <div class="input-col">
                <label>Select Old District</label>
                <select id="searchDistrict" class="custom-input" onchange="clearCscId()">
                    <option value="">-- Select AP Old District --</option>
                    <option value="ANANTAPUR">Anantapur</option>
                    <option value="CHITTOOR">Chittoor</option>
                    <option value="EAST GODAVARI">East Godavari</option>
                    <option value="GUNTUR">Guntur</option>
                    <option value="KRISHNA">Krishna</option>
                    <option value="KURNOOL">Kurnool</option>
                    <option value="PRAKASAM">Prakasam</option>
                    <option value="SPSR NELLORE">SPSR Nellore</option>
                    <option value="SRIKAKULAM">Srikakulam</option>
                    <option value="VISAKHAPATNAM">Visakhapatnam</option>
                    <option value="VIZIANAGARAM">Vizianagaram</option>
                    <option value="WEST GODAVARI">West Godavari</option>
                    <option value="YSR KADAPA">YSR Kadapa</option>
                </select>
            </div>

            <div class="action-buttons">
                <button class="search-btn" onclick="fetchVleData()"><i class="fa-solid fa-magnifying-glass me-2"></i> Search</button>
                <button class="reset-btn" onclick="resetAll()"><i class="fa-solid fa-rotate-right me-1"></i> Reset</button>
            </div>
        </div>
    </div>

    <div id="vleSearchLoader">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--forest);"></i>
        <div class="loader-text">Loading data... Please wait (One-time fetch)</div>
    </div>

    <div id="actionToolbar" class="action-toolbar">
        <div class="live-search-wrapper">
            <i class="fa-solid fa-filter" style="color: var(--forest); font-size: 14px;"></i>
            <input type="text" id="liveSearchInput" class="live-search-input" placeholder="Search by Name, CSC ID, or District in this list..." onkeyup="applyLiveSearch()">
        </div>
        
        <div id="resultStats" class="result-stats"></div>
        
        <button class="download-btn" onclick="downloadStyledExcel()"><i class="fa-solid fa-file-excel me-2"></i> Download Excel</button>
    </div>

    <div class="table-container" id="resultsTableContainer">
        <div class="table-wrapper">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="width: 55px; text-align: center;">S.No</th>
                        <th>CSC ID</th>
                        <th>VLE Name</th>
                        <th>Mobile No</th>
                        <th>Old District</th>
                        <th>New District</th>
                        <th>District Manager</th>
                    </tr>
                </thead>
                <tbody id="vleTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="copyToast" class="copy-toast"><i class="fa-solid fa-circle-check me-2"></i> Copied to clipboard!</div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec";

        let globalMasterData = []; 
        let currentFilteredData = [];
        let dataToExport = []; 

        // 🌟 IndexedDB Setup for Permanent Bullet-proof Caching 🌟
        function initDB() {
            return new Promise((resolve, reject) => {
                let request = indexedDB.open("VleMasterDatabase", 1);
                request.onupgradeneeded = function(e) {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains("masterStore")) {
                        db.createObjectStore("masterStore", { keyPath: "id" });
                    }
                };
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e); };
            });
        }

        async function saveToDB(data) {
            try {
                let db = await initDB();
                let tx = db.transaction("masterStore", "readwrite");
                let store = tx.objectStore("masterStore");
                store.put({ id: "vleData", value: data, timestamp: Date.now() });
                
                let csc = document.getElementById("searchCscId").value.trim();
                let dist = document.getElementById("searchDistrict").value;
                store.put({ id: "lastSearch", csc: csc, dist: dist });
            } catch(e) { console.error("DB Save Error:", e); }
        }

        async function loadFromDB() {
            try {
                let db = await initDB();
                let tx = db.transaction("masterStore", "readonly");
                let store = tx.objectStore("masterStore");
                
                let dataReq = store.get("vleData");
                let searchReq = store.get("lastSearch");

                dataReq.onsuccess = function() {
                    if(dataReq.result && (Date.now() - dataReq.result.timestamp < 86400000)) {
                        globalMasterData = dataReq.result.value;
                        
                        searchReq.onsuccess = function() {
                            if(searchReq.result) {
                                document.getElementById("searchCscId").value = searchReq.result.csc || "";
                                document.getElementById("searchDistrict").value = searchReq.result.dist || "";
                                
                                if(searchReq.result.csc || searchReq.result.dist) {
                                    setTimeout(() => { processLocalData(searchReq.result.csc, searchReq.result.dist); }, 100);
                                }
                            }
                        };
                    }
                };
            } catch(e) { console.error("DB Load Error:", e); }
        }

        document.addEventListener("DOMContentLoaded", loadFromDB);

        function clearDistrict() { document.getElementById("searchDistrict").value = ""; }
        function clearCscId() { document.getElementById("searchCscId").value = ""; }

        function resetAll() {
            document.getElementById("searchCscId").value = "";
            document.getElementById("searchDistrict").value = "";
            document.getElementById("liveSearchInput").value = "";
            document.getElementById("resultsTableContainer").style.display = "none";
            document.getElementById("actionToolbar").style.display = "none";
            document.getElementById("vleTableBody").innerHTML = "";
            currentFilteredData = [];
            dataToExport = [];
            
            initDB().then(db => {
                let tx = db.transaction("masterStore", "readwrite");
                tx.objectStore("masterStore").put({ id: "lastSearch", csc: "", dist: "" });
            });
        }

        async function forceRefreshData() {
            try {
                let db = await initDB();
                let tx = db.transaction("masterStore", "readwrite");
                tx.objectStore("masterStore").clear();
            } catch(e) {}
            
            globalMasterData = [];
            resetAll();
            alert("✅ Cache Cleared! Please click 'Search' to download fresh data.");
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                let toast = document.getElementById("copyToast");
                toast.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i> Copied: <strong>${text}</strong>`;
                toast.className = "copy-toast show";
                setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2500);
            }).catch(err => { console.error('Failed to copy: ', err); });
        }

        function fetchVleData() {
            var cscId = document.getElementById("searchCscId").value.trim().toUpperCase();
            var district = document.getElementById("searchDistrict").value.trim();

            if(cscId === "" && district === "") {
                alert("Please enter CSC ID or select a District!");
                return;
            }

            if(globalMasterData && globalMasterData.length > 0) {
                processLocalData(cscId, district);
                return;
            }

            document.getElementById("resultsTableContainer").style.display = "none";
            document.getElementById("actionToolbar").style.display = "none";
            document.getElementById("vleSearchLoader").style.display = "block";

            var payload = { action: "searchVleDetails" };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(response => {
                document.getElementById("vleSearchLoader").style.display = "none";

                if(response && response.success) {
                    globalMasterData = response.data; 
                    saveToDB(globalMasterData);
                    processLocalData(cscId, district); 
                } else {
                    let errMsg = (response && response.message) ? response.message : "Failed to load data.";
                    alert("❌ Server Error: " + errMsg);
                }
            })
            .catch(error => {
                document.getElementById("vleSearchLoader").style.display = "none";
                alert("❌ Connection Error: Please check your internet connection.");
            });
        }

        function processLocalData(cscId, district) {
            if(!globalMasterData || globalMasterData.length === 0) {
                alert("❌ Data is empty. Please click 'Sync Latest Data'.");
                resetAll();
                return;
            }

            initDB().then(db => {
                let tx = db.transaction("masterStore", "readwrite");
                tx.objectStore("masterStore").put({ id: "lastSearch", csc: cscId, dist: district });
            });

            currentFilteredData = globalMasterData.filter(v => {
                let vCscId = v.cscId ? v.cscId.toString().toUpperCase() : "";
                let vOldD = v.oldDistrict ? v.oldDistrict.toString().toUpperCase() : "";
                let vNewD = v.newDistrict ? v.newDistrict.toString().toUpperCase() : "";

                if(cscId) { return vCscId.includes(cscId); }
                else if(district) { return vOldD.includes(district.toUpperCase()) || vNewD.includes(district.toUpperCase()); }
                return true;
            });

            if(currentFilteredData.length === 0) {
                alert("❌ No data found for your search!");
                resetAll();
                return;
            }

            renderTable(currentFilteredData);
            document.getElementById("actionToolbar").style.display = "flex";
            document.getElementById("liveSearchInput").value = ""; 
        }

        function applyLiveSearch() {
            var query = document.getElementById("liveSearchInput").value.trim().toUpperCase();
            if(query === "") { renderTable(currentFilteredData); return; }

            var liveFiltered = currentFilteredData.filter(v => {
                let vCscId = v.cscId ? v.cscId.toString().toUpperCase() : "";
                let vName = v.vleName ? v.vleName.toString().toUpperCase() : "";
                let vOldD = v.oldDistrict ? v.oldDistrict.toString().toUpperCase() : "";
                let vNewD = v.newDistrict ? v.newDistrict.toString().toUpperCase() : "";
                let vMob = v.mobile ? v.mobile.toString() : "";

                return vName.includes(query) || vCscId.includes(query) || vOldD.includes(query) || vNewD.includes(query) || vMob.includes(query);
            });

            renderTable(liveFiltered);
        }

        function renderTable(dataArray) {
            dataToExport = dataArray; 
            document.getElementById("resultStats").innerHTML = `<i class="fa-solid fa-circle-check me-2" style="color:#15803d;"></i> <strong>${dataArray.length}</strong> record(s) found.`;

            var tbody = document.getElementById("vleTableBody");
            var rowsHtml = "";

            dataArray.forEach((v, index) => {
                rowsHtml += `
                <tr>
                    <td data-label="S.No" style="text-align: center; color: #525d56; font-weight: 800;">#${index + 1}</td>
                    
                    <td data-label="CSC ID" class="copyable" ondblclick="copyText('${v.cscId}')" title="Double click to copy">
                        <span class="badge-csc">${v.cscId}</span>
                    </td>
                    
                    <td data-label="VLE Name" class="text-vle copyable" ondblclick="copyText('${v.vleName}')" title="Double click to copy">${v.vleName}</td>
                    
                    <td data-label="Mobile No" class="copyable" ondblclick="copyText('${v.mobile}')" title="Double click to copy">
                        <div style="display: inline-flex; align-items: center; background: #ffffff; padding: 3px 4px 3px 10px; border-radius: 6px; border: 1px solid #d5cfbe;">
                            <span style="font-weight: 800; color: #122d22; margin-right: 10px;">${v.mobile}</span>
                            <a href="tel:${v.mobile}" onclick="event.stopPropagation();" title="Click to Call" style="background: #1b4332; color: #e6c885; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 5px; text-decoration: none; transition: 0.2s;" onmouseover="this.style.background='#c5a059'; this.style.color='#141a17';" onmouseout="this.style.background='#1b4332'; this.style.color='#e6c885';">
                                <i class="fa-solid fa-phone" style="font-size: 11px;"></i>
                            </a>
                        </div>
                    </td>
                    
                    <td data-label="Old District" class="copyable" ondblclick="copyText('${v.oldDistrict}')" title="Double click to copy">${v.oldDistrict}</td>
                    
                    <td data-label="New District" class="copyable" ondblclick="copyText('${v.newDistrict}')" title="Double click to copy">${v.newDistrict}</td>
                    
                    <td data-label="District Manager" class="text-dm copyable" ondblclick="copyText('${v.dmName}')" title="Double click to copy">
                        <i class="fa-solid fa-user-tie me-1"></i> ${v.dmName}
                    </td>
                </tr>`;
            });

            tbody.innerHTML = rowsHtml;
            document.getElementById("resultsTableContainer").style.display = "block";
        }

        async function downloadStyledExcel() {
            if(dataToExport.length === 0) { alert("No data available to download!"); return; }

            var cscIdVal = document.getElementById("searchCscId").value.trim().toUpperCase();
            var districtVal = document.getElementById("searchDistrict").value.trim();
            var liveSearchVal = document.getElementById("liveSearchInput").value.trim();

            var reportTitle = "VLEs Data";
            var fileName = "VLEs_Data";

            if (districtVal !== "") {
                let properDist = districtVal.charAt(0).toUpperCase() + districtVal.slice(1).toLowerCase();
                reportTitle = properDist + " VLEs Data";
                fileName = districtVal.toUpperCase() + "_VLEs_Data";
            } else if (cscIdVal !== "") {
                reportTitle = "VLEs Data (CSC ID: " + cscIdVal + ")";
                fileName = "VLE_Data_" + cscIdVal;
            }

            if (liveSearchVal !== "") { reportTitle += " (Filtered)"; fileName += "_Filtered"; }
            fileName += ".xlsx";

            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('VLE Data');

            const titleRow = worksheet.addRow([reportTitle]);
            worksheet.mergeCells('A1:G1');
            titleRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1B4332' } }; 
            titleRow.getCell(1).font = { color: { argb: 'FFE6C885' }, size: 14, bold: true };
            titleRow.getCell(1).alignment = { vertical: 'middle', horizontal: 'center' }; 
            titleRow.height = 28;

            worksheet.addRow([]); 

            const headers = ["S.No", "CSC ID", "VLE Name", "Mobile No", "Old District", "New District", "District Manager"];
            const headerRow = worksheet.addRow(headers);
            headerRow.eachCell((cell) => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF7EFE0' } }; 
                cell.font = { color: { argb: 'FF122D22' }, bold: true, size: 11 };
                cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
            });
            headerRow.height = 22;

            dataToExport.forEach((v, index) => {
                const row = worksheet.addRow([
                    index + 1, v.cscId, v.vleName, v.mobile, v.oldDistrict, v.newDistrict, v.dmName
                ]);
                row.eachCell((cell) => {
                    cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                    cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                });
            });

            worksheet.getColumn(1).width = 8;   
            worksheet.getColumn(2).width = 20;  
            worksheet.getColumn(3).width = 40;  
            worksheet.getColumn(4).width = 16;  
            worksheet.getColumn(5).width = 20;  
            worksheet.getColumn(6).width = 25;  
            worksheet.getColumn(7).width = 25;  

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
        }
    </script>
</body>
