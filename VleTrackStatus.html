<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Request Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
    :root {
      --cream-bg: #f4f1e6;
      --cream-card: #faf8f2;
      --cream-alt: #f0ece0;
      --forest: #1b4332;
      --forest-dark: #122d22;
      --forest-soft: #e9f2ed;
      --gold: #c5a059;
      --gold-soft: #f7efe0;
      --charcoal: #141a17;
      --muted: #525d56;
      --border: #d5cfbe;
    }

    body {
      background: var(--cream-bg);
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
      padding: 20px 18px;
      min-height: 100vh;
      color: var(--charcoal);
    }

    .split-container { display: flex; gap: 20px; align-items: flex-start; transition: all 0.4s ease; }
    .left-panel { flex: 1; max-width: 800px; margin: 0 auto; transition: all 0.4s ease; }
    .split-container.active .left-panel { flex: 0 0 45%; max-width: 45%; margin: 0; }
    .right-panel { flex: 0 0 calc(55% - 20px); max-width: calc(55% - 20px); position: sticky; top: 20px; display: none; opacity: 0; transform: translateX(20px); transition: all 0.4s ease; }
    .right-panel.show-panel { display: block; opacity: 1; transform: translateX(0); animation: fadeInRight 0.4s ease-out forwards; }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

    .premium-card {
      background: var(--cream-card);
      border: 1.5px solid var(--forest);
      border-top: 5px solid var(--gold);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(27, 67, 50, 0.08);
      overflow: hidden;
    }
    .card-header-custom {
      background: var(--cream-card);
      padding: 16px 22px 14px 22px;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .req-item-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 14px;
      transition: all 0.25s ease;
      border-left: 4px solid var(--forest);
    }
    .req-item-card:hover {
      background: var(--gold-soft);
      box-shadow: 0 5px 14px rgba(27, 67, 50, 0.08);
      transform: translateY(-2px);
    }
    .req-item-card.active {
      background: var(--forest-soft);
      border-color: #a7ccb8;
      border-left-color: var(--gold);
      box-shadow: 0 5px 15px rgba(27, 67, 50, 0.12);
    }

    .status-badge {
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .btn-action {
      font-weight: 800;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      transition: all 0.25s ease;
    }
    .btn-primary-custom {
      background: linear-gradient(135deg, var(--forest), var(--forest-dark));
      color: #f8f5ec;
      border: 1.5px solid var(--gold);
      box-shadow: 0 4px 10px rgba(27, 67, 50, 0.2);
    }
    .btn-primary-custom:hover {
      background: var(--gold);
      color: var(--charcoal);
      border-color: #a6823c;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(197, 160, 89, 0.35);
    }

    .btn-view-doc {
      background: var(--gold-soft);
      color: var(--forest-dark);
      border: 1.5px solid var(--gold);
      font-weight: 800;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 6px;
      transition: 0.2s;
    }
    .btn-view-doc:hover { background: var(--gold); color: var(--charcoal); }
    .btn-view-doc.active { background: var(--forest); color: #f8f5ec; border-color: var(--forest-dark); }

    .btn-close-panel {
      background: #ffffff;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      transition: 0.2s;
    }
    .btn-close-panel:hover { background: #fee2e2; color: #7f1d1d; }

    .doc-viewer-wrapper {
      background: var(--cream-alt);
      border-radius: 10px;
      padding: 10px;
      height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 1.5px dashed var(--gold);
    }
    .doc-iframe {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(27, 67, 50, 0.06);
    }

    @media (max-width: 991px) {
      .split-container.active { flex-direction: column; }
      .split-container.active .left-panel, .right-panel { flex: 0 0 100%; max-width: 100%; }
      .right-panel { position: relative; top: 0; margin-top: 20px; }
      .doc-viewer-wrapper { height: 600px; }
    }

    /* 📱 MOBILE RESPONSIVE STYLES 📱 */
    @media (max-width: 768px) {
      body { padding: 14px 10px; }
      .d-flex.justify-content-between.align-items-center.mb-4 {
        flex-direction: column;
        align-items: flex-start !important;
        gap: 12px;
        margin-bottom: 18px !important;
      }
      .btn-action.btn-primary-custom { width: 100%; padding: 11px; font-size: 14px; }

      .card-body.p-3 { padding: 14px !important; }
      .req-item-card { padding: 12px; }
      .status-badge { font-size: 10px; padding: 3px 8px; text-align: right; line-height: 1.3; }
      .btn-view-doc { width: 100%; margin-top: 10px; padding: 9px; }

      .split-container.active .right-panel {
        margin-top: 15px;
        margin-bottom: 20px;
        transform: translateY(10px);
        animation: slideUpMobile 0.4s ease-out forwards;
      }
      @keyframes slideUpMobile {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .card-header-custom.py-2 {
        flex-direction: column;
        align-items: flex-start !important;
        gap: 10px;
        padding: 14px !important;
      }
      .card-header-custom .d-flex.gap-2 { width: 100%; }
      #btnPrintCurrent, .btn-close-panel { flex: 1; padding: 9px; font-size: 13px !important; }
      .doc-viewer-wrapper { height: 450px; }
    }
  </style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GF2VXY76KN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GF2VXY76KN');
</script>

</head>
<body>

  <div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-4 px-1 flex-wrap gap-2">
      <h4 class="fw-bold m-0" style="font-family:'Cinzel', serif; color: var(--forest-dark); letter-spacing: 0.5px; text-transform: uppercase;">🔍 Track Request Status</h4>
      <button id="btnFetchTrack" class="btn-action btn-primary-custom" onclick="fetchMyStatus()">🔄 Refresh Status</button>
    </div>

    <div class="split-container" id="mainContainer">
        <div class="left-panel">
            <div class="premium-card">
                <div class="card-header-custom border-bottom-0 pb-2">
                    <h6 class="fw-bold m-0" style="font-family:'Cinzel', serif; color: var(--forest); font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.5px;">📋 Recent Requests</h6>
                </div>
                <div class="card-body p-3" id="trackResultArea" style="max-height: calc(100vh - 160px); overflow-y: auto;">
                    <div class="text-center fw-bold py-5" style="color: var(--muted);">లోడ్ అవుతోంది...</div>
                </div>
            </div>
        </div>

        <div class="right-panel" id="docPanel">
            <div class="premium-card h-100" style="border-top: 4px solid var(--gold);">
                <div class="card-header-custom py-2" style="background: var(--forest-dark); border-bottom: 2px solid var(--gold);">
                    <h6 class="fw-bold m-0" style="font-family:'Cinzel', serif; color: #e6c885; font-size: 13.5px; letter-spacing: 0.4px;">📄 Document Preview</h6>
                    <div class="d-flex gap-2">
                        <button class="btn-action py-1 px-3 d-none" id="btnPrintCurrent" onclick="printCurrentDoc()" style="font-size: 11px; background: var(--gold); color: var(--charcoal); border: 1px solid #a6823c;">🖨️ Print Doc</button>
                        <button class="btn-close-panel" onclick="closeDocPanel()">✖ Close</button>
                    </div>
                </div>
                <div class="card-body p-3">
                    <div class="doc-viewer-wrapper" id="docViewerWrapper"></div>
                </div>
            </div>
        </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec";
    let loggedInId = localStorage.getItem("userId") || "";
    let loggedInUser = localStorage.getItem("userName") || "";
    let generatedDocsMemory = {}; 
    let currentDocHtml = ""; 

    window.onload = function() { fetchMyStatus(); };

    function fetchMyStatus() {
         let btn = document.getElementById('btnFetchTrack');
         let resultArea = document.getElementById('trackResultArea');
         
         btn.disabled = true; btn.innerHTML = "⏳ Fetching..."; 
         resultArea.innerHTML = `<div class="text-center fw-bold py-5" style="color:var(--muted);">Refreshing data...</div>`;
         
         closeDocPanel();
         generatedDocsMemory = {}; 
         
         fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "checkVleStatus", vleId: loggedInId }) })
         .then(res => res.json()).then(res => {
            btn.disabled = false; btn.innerHTML = "🔄 Refresh Status";

            if(res.success && res.data.length > 0) {
               let html = ``;
               res.data.forEach((req, index) => {
                  let bg = "#f0ece0", col = "#525d56", borderCol = "#d5cfbe";
                  let st = req.status;
                  
                  if(st.includes("Pending with SPOC")) { bg = "#eef5f7"; col = "#164e63"; borderCol = "#a7d0dc"; }
                  else if(st === "Pending") { bg = "#f7efe0"; col = "#92400e"; borderCol = "#dfc48e"; }
                  else if(st === "Approved by SPOC") { bg = "#fff7ed"; col = "#9a3412"; borderCol = "#fed7aa"; }
                  else if(st === "Dispatched") { bg = "#dcfce7"; col = "#15803d"; borderCol = "#bbf7d0"; }
                  else if(st.includes("Rejected")) { bg = "#fee2e2"; col = "#b91c1c"; borderCol = "#fecaca"; }

                  let rawRemarks = req.remarks || "-";
                  let finalRemarks = rawRemarks;
                  let docBtnHtml = "";
                  
                  let finalReqNo = req.reqNo ? req.reqNo : "N/A";

                  if(rawRemarks.includes("(Serials:")) {
                      let splitPart = rawRemarks.split("(Serials:");
                      finalRemarks = splitPart[0].trim();
                      let serialsPart = splitPart[1].replace(")", "").trim();
                      
                      generatedDocsMemory[index] = generateDocHtml(req.date, req.qty, serialsPart, finalReqNo);
                      docBtnHtml = `<div class="mt-3 text-end"><button onclick="viewDocInRightPanel(${index}, this)" class="btn-view-doc">👁️ View Document</button></div>`;
                  }

                  html += `
                    <div class="req-item-card" id="card-${index}">
                        <div class="d-flex justify-content-between align-items-center mb-2 pb-2" style="border-bottom: 1px solid var(--border);">
                          <span style="font-size:12px; color:#525d56; font-weight:700;">📅 ${req.date}</span>
                          <span class="status-badge" style="background:${bg}; color:${col}; border-color:${borderCol};">${st}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <div><span style="font-size:12px; color:#525d56; font-weight:700;">Req Qty:</span> <strong style="font-size:15px; color:#122d22;">${req.qty} P</strong></div>
                        </div>
                        <div style="font-size:12px; margin-top:6px; color: #141a17; font-weight:600; background: #faf8f2; padding: 7px 10px; border-radius: 6px; border: 1px solid #d5cfbe;">
                            ${finalRemarks}
                        </div>
                        ${docBtnHtml}
                    </div>
                  `;
               });
               resultArea.innerHTML = html;
            } else {
               resultArea.innerHTML = `<div class="text-center py-4"><span style="font-size:30px;">📭</span><br><span class="fw-bold" style="color:#b91c1c;">No stock requests found.</span></div>`;
            }
         }).catch(e => {
            btn.disabled = false; btn.innerText = "🔄 Refresh Status";
            resultArea.innerHTML = `<div class="text-center py-4 fw-bold" style="color:#b91c1c;">⚠️ Network Error.</div>`;
         });
    }

    function generateDocHtml(date, qty, serials, generatedReqNo) {
        let userName = loggedInUser;
        let userId = loggedInId;
        return `
            <html><head><title>ACK_${userId}</title><style>
                body { font-family: 'Arial', sans-serif; padding: 20px; color: #141a17; margin: 0; background: white; }
                .header { text-align: center; border-bottom: 2px solid #1b4332; padding-bottom: 15px; margin-bottom: 20px; }
                .header img { height: 50px; margin-bottom: 10px; }
                .header h2 { margin: 0; font-size: 18px; font-weight: 900; color: #122d22; }
                .header h3 { margin: 5px 0 0 0; font-size: 14px; text-transform: uppercase; color: #7c4a12; letter-spacing: 1px; }
                .details-table { width: 100%; margin-bottom: 20px; font-size: 13px; border-collapse: collapse; } 
                .details-table td { padding: 8px; border: 1px solid #d5cfbe; }
                .details-table td strong { color: #1b4332; }
                .section { margin-bottom: 20px; } 
                .section h4 { background: #f4f1e6; padding: 8px 12px; margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; color: #122d22; border-radius: 4px; border: 1px solid #d5cfbe; } 
                .section p { margin: 5px 0; font-size: 13px; padding-left: 12px; }
                .serial-highlight { display: block; padding: 10px 15px; margin: 10px 12px; border: 2px dashed #c5a059; background-color: #faf8f2; font-weight: 800; font-size: 14px; letter-spacing: 0.5px; border-radius: 6px; text-align: center; color: #1b4332; }
                .declaration { font-style: italic; line-height: 1.6; margin-bottom: 40px; font-size: 12px; text-align: justify; color: #141a17; padding: 15px; background: #f7efe0; border-radius: 6px; border-left: 4px solid #c5a059; }
                .signature-box { display: flex; justify-content: space-between; margin-top: 50px; padding: 0 20px; font-size: 13px; }
                .office-use { border-top: 2px dashed #d5cfbe; padding-top: 20px; margin-top: 30px; } 
                .office-use h4 { text-align: center; margin-top: 0; font-size: 14px; color: #525d56; letter-spacing: 2px; text-transform: uppercase; }
                @media print { @page { margin: 10mm; size: A4; } body { padding: 0; max-width: 100%; background: white; } .serial-highlight { border: 2px solid black !important; color: black !important; } }
            </style></head>
            <body>
                <div class="header">
                    <h2>COMMON SERVICE CENTRES (CSC) - ANDHRA PRADESH</h2>
                    <h3>E-STAMPING STATIONARY ACKNOWLEDGEMENT FORM</h3>
                </div>
                <table class="details-table">
                    <tr><td><strong>Date of Dispatch:</strong> ${date}</td><td><strong>Request ID:</strong> <span style="font-weight:900; color:#b91c1c;">${generatedReqNo}</span></td></tr>
                </table>
                <div class="section">
                    <h4>VLE DETAILS</h4>
                    <p><strong>Name:</strong> <span style="font-weight:900; font-size: 14px;">${userName}</span></p>
                    <p><strong>CSC ID:</strong> <span style="font-weight:900; font-size: 14px;">${userId}</span></p>
                </div>
                <div class="section">
                    <h4>ALLOCATED STOCK DETAILS</h4>
                    <p><strong>Quantity Sanctioned:</strong> <span style="font-weight:900; font-size: 14px;">${qty} Papers</span></p>
                    <div class="serial-highlight">${serials}</div>
                </div>
                <div class="section declaration">I, <strong>${userName}</strong>, hereby acknowledge that I have received the physical e-Stamping stationary mentioned above from the District Manager's office. I ensure that these stamp papers will be used strictly for authorized CSC e-Stamping purposes.</div>
                <div class="signature-box"><div><p>___________________________</p><p><strong>(VLE Signature & Stamp)</strong></p><p>Date: ______________</p></div></div>
                <div class="office-use"><h4>FOR OFFICE USE ONLY</h4><div class="signature-box" style="margin-bottom:0;"><div><p>___________________________</p><p><strong>Stock Handed Over By</strong></p><p>Date: ______________</p></div></div></div>
                <script>window.onafterprint = function() { window.close(); };<\/script>
            </body></html>`;
    }

    function viewDocInRightPanel(index, btnElement) {
        let rawHtml = generatedDocsMemory[index];
        if(!rawHtml) return;
        currentDocHtml = rawHtml; 
        document.querySelectorAll('.btn-view-doc').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.req-item-card').forEach(c => c.classList.remove('active'));
        btnElement.classList.add('active');
        btnElement.closest('.req-item-card').classList.add('active');
        document.getElementById('mainContainer').classList.add('active');
        document.getElementById('docPanel').classList.add('show-panel');
        let wrapper = document.getElementById('docViewerWrapper');
        wrapper.innerHTML = `<iframe class="doc-iframe" id="printIframe"></iframe>`;
        let iframe = document.getElementById('printIframe');
        let doc = iframe.contentWindow.document;
        doc.open(); doc.write(rawHtml); doc.close();
        document.getElementById('btnPrintCurrent').classList.remove('d-none');
    }

    function closeDocPanel() {
        document.getElementById('mainContainer').classList.remove('active');
        document.getElementById('docPanel').classList.remove('show-panel');
        document.querySelectorAll('.btn-view-doc').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.req-item-card').forEach(c => c.classList.remove('active'));
        document.getElementById('docViewerWrapper').innerHTML = '';
        document.getElementById('btnPrintCurrent').classList.add('d-none');
        currentDocHtml = "";
    }

    function printCurrentDoc() {
        if(!currentDocHtml) return;
        let printWindow = window.open('', '_blank');
        printWindow.document.write(currentDocHtml); printWindow.document.close();
        let script = printWindow.document.createElement('script');
        script.innerHTML = "window.onload = function() { setTimeout(function() { window.print(); }, 500); };";
        printWindow.document.body.appendChild(script);
    }
  </script>
</body>
</html>
