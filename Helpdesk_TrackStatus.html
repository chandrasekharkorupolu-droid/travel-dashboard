<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Ticket Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
        :root {
            --cream-bg: #f4f1e6;
            --cream-card: #faf8f2;
            --cream-alt: #f0ece0;
            --forest: #1b4332;
            --forest-dark: #122d22;
            --forest-soft: #e9f2ed;
            --primary-gold: #c5a059;
            --hover-gold: #a6823c;
            --gold-soft: #f7efe0;
            --text-dark: #141a17;
            --muted: #525d56;
            --border-color: #d5cfbe;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .helpdesk-card {
            width: 100%;
            max-width: 600px;
            background: var(--cream-card);
            border: 1.5px solid var(--forest);
            border-top: 6px solid var(--primary-gold);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(27, 67, 50, 0.12);
            animation: fadeIn 0.3s ease-out;
            overflow: hidden;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-header {
            padding: 20px 28px;
            background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
            border-bottom: 3px solid var(--primary-gold);
            text-align: center;
        }
        .card-header h2 {
            font-family: 'Cinzel', serif;
            margin: 0;
            color: #e6c885;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-body { padding: 36px 30px; text-align: center; }

        label {
            display: block;
            font-weight: 800;
            margin-bottom: 14px;
            color: var(--forest-dark);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .track-input {
            width: 100%;
            max-width: 400px;
            padding: 14px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 20px;
            font-weight: 800;
            color: var(--forest-dark);
            background-color: #ffffff;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.25s ease;
            margin: 0 auto;
            display: block;
        }
        .track-input:focus {
            outline: none;
            border-color: var(--forest);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(27, 67, 50, 0.14);
        }
        .track-input::placeholder { color: #8f8873; font-weight: 500; }

        .submit-btn {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            background: linear-gradient(135deg, var(--forest), var(--forest-dark));
            color: #f8f5ec;
            border: 1.5px solid var(--primary-gold);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 22px;
            text-transform: uppercase;
            box-shadow: 0 6px 16px rgba(27, 67, 50, 0.22);
        }
        .submit-btn:hover {
            background: var(--primary-gold);
            color: var(--text-dark);
            border-color: var(--hover-gold);
            transform: translateY(-1px);
        }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* 🌟 Result Box 🌟 */
        .result-box {
            display: none;
            margin-top: 28px;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-left: 5px solid var(--primary-gold);
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.06);
            animation: fadeIn 0.3s;
        }
        .result-box p {
            margin: 8px 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
            overflow: hidden;
        }
        .result-box span { font-weight: 800; color: var(--forest-dark); float: right; }

        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
        .status-pending { background: var(--gold-soft); color: #92400e !important; border: 1px solid #dfc48e; }
        .status-resolved { background: #dcfce7; color: #15803d !important; border: 1px solid #bbf7d0; }

        .error-msg {
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13.5px;
            margin-top: 20px;
            display: none;
        }

        /* 📱 MOBILE RESPONSIVENESS 📱 */
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .helpdesk-card { width: 100%; border-radius: 12px; }
            .card-header { padding: 16px 18px; }
            .card-header h2 { font-size: 17px; }
            .card-body { padding: 24px 18px; }
            label { font-size: 13px; margin-bottom: 10px; }
            .track-input { font-size: 16px; padding: 12px; }
            .submit-btn { font-size: 14.5px; padding: 12px; margin-top: 16px; }
            .result-box { padding: 15px; margin-top: 20px; }
            .result-box p {
                font-size: 13px;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .result-box span { float: none; width: 100%; word-wrap: break-word; }
        }
    </style>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GF2VXY76KN');
</script>

</head>
<body>

    <div class="helpdesk-card">
        <div class="card-header">
            <h2>🔍 CHECK TICKET STATUS</h2>
        </div>
        <div class="card-body">
            <label>Enter Ticket No to Track Status:</label>
            <input type="text" id="trackTicketInput" class="track-input" placeholder="VSP-1001" maxlength="15" oninput="formatTicketNumber(this)" onkeypress="handleEnter(event)">
            
            <button class="submit-btn" id="trackBtn" onclick="trackTicket()">Check Status</button>

            <div id="errorMsg" class="error-msg"></div>
            
            <div id="resultBox" class="result-box">
                <p>Service: <span id="rService" style="color:#7c4a12;"></span></p>
                <p>Issue: <span id="rIssue"></span></p>
                <p>Date & Time: <span id="rDate" style="color:#525d56;"></span></p>
                <p>Status: <span id="rStatus"></span></p>
                <p style="border-bottom:none; padding-bottom:0; margin-bottom:0;">Remarks: <span id="rRemarks" style="color:#b91c1c;"></span></p>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec"; 

        function formatTicketNumber(input) {
            let val = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            if (val.length > 3) {
                val = val.slice(0, 3) + '-' + val.slice(3);
            }
            input.value = val;
        }

        function handleEnter(event) {
            if (event.key === "Enter") trackTicket();
        }

        async function trackTicket() {
            let tInput = document.getElementById("trackTicketInput").value.trim();
            let trackBtn = document.getElementById("trackBtn");
            let resultBox = document.getElementById("resultBox");
            let errorMsg = document.getElementById("errorMsg");

            resultBox.style.display = "none";
            errorMsg.style.display = "none";

            if (tInput.length < 5) {
                errorMsg.innerText = "⚠️ Please enter a valid Ticket ID";
                errorMsg.style.display = "block";
                return;
            }

            trackBtn.innerText = "Searching...";
            trackBtn.disabled = true;

            try {
                let response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "trackTicket", ticketId: tInput })
                });
                
                let result = await response.json();

                if (result.success) {
                    document.getElementById("rService").innerText = result.ticket.service;
                    document.getElementById("rIssue").innerText = result.ticket.issue;
                    document.getElementById("rDate").innerText = result.ticket.date;
                    document.getElementById("rRemarks").innerText = result.ticket.remarks;
                    
                    let sSpan = document.getElementById("rStatus");
                    sSpan.innerText = result.ticket.status;
                    sSpan.className = "status-badge " + (result.ticket.status.toUpperCase() === "PENDING" ? "status-pending" : "status-resolved");
                    
                    resultBox.style.display = "block";
                } else {
                    errorMsg.innerText = result.message;
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                errorMsg.innerText = "❌ Server Error. Please try again.";
                errorMsg.style.display = "block";
            } finally {
                trackBtn.innerText = "Check Status";
                trackBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
