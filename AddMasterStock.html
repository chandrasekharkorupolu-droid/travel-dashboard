<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DM Master Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
    :root {
      --cream-bg: #f4f1e6;
      --cream-card: #faf8f2;
      --cream-alt: #f0ece0;
      --forest: #1b4332;
      --forest-dark: #122d22;
      --forest-soft: #e9f2ed;
      --gold: #c5a059;
      --gold-soft: #f7efe0;
      --charcoal: #141a17;
      --muted: #525d56;
      --border: #d5cfbe;
    }

    body { 
        margin: 0; 
        font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif; 
        background-color: var(--cream-bg);
        color: var(--charcoal);
        padding: 40px 20px; 
        box-sizing: border-box; 
        display: flex; 
        justify-content: center; 
        align-items: flex-start;
        min-height: 100vh;
    }
    
    /* 🌟 Royal Form Box 🌟 */
    .form-box { 
        background: var(--cream-card); 
        border: 1.5px solid var(--forest); 
        border-top: 6px solid var(--gold);
        box-shadow: 0 12px 30px rgba(27, 67, 50, 0.12), 0 4px 12px rgba(27, 67, 50, 0.06);
        border-radius: 18px; 
        padding: 36px 40px; 
        width: 100%; 
        max-width: 600px; 
        position: relative;
        animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1); 
        box-sizing: border-box;
    }

    @keyframes slideUp { 
        from { transform: translateY(25px); opacity: 0; } 
        to { transform: translateY(0); opacity: 1; } 
    }
    
    /* 🌟 Title Section 🌟 */
    .title-row { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 14px; 
        margin-bottom: 28px; 
        padding-bottom: 18px;
        border-bottom: 2px dashed var(--gold);
    }
    .title-icon {
        background: linear-gradient(135deg, var(--forest), var(--forest-dark));
        padding: 11px 13px;
        border-radius: 12px;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e6c885;
        box-shadow: 0 4px 12px rgba(27, 67, 50, 0.2);
        border: 1.5px solid var(--gold);
    }
    .title-row h2 { 
        font-family: 'Cinzel', serif;
        margin: 0; 
        color: var(--forest-dark); 
        font-size: 23px; 
        font-weight: 800; 
        letter-spacing: 0.6px;
        text-transform: uppercase;
    }
    
    /* 🌟 Input Groups 🌟 */
    .row-2 { 
        display: flex; 
        gap: 18px; 
        flex-wrap: wrap;
    }
    .row-2 .form-group { 
        flex: 1 1 200px; 
    }
    
    .form-group { margin-bottom: 22px; position: relative; width: 100%; }
    .form-group label { 
        display: block; 
        font-size: 12px; 
        font-weight: 800; 
        color: var(--forest-dark); 
        margin-bottom: 7px; 
        text-transform: uppercase; 
        letter-spacing: 0.5px; 
    }
    
    .custom-input, .custom-select { 
        width: 100%; 
        padding: 13px 15px; 
        border: 1.5px solid var(--border); 
        border-radius: 10px; 
        font-size: 15px; 
        color: var(--charcoal); 
        box-sizing: border-box; 
        outline: none; 
        background: #ffffff; 
        transition: all 0.25s ease; 
        font-weight: 700; 
    }
    
    .custom-input:focus:not([readonly]) { 
        border-color: var(--forest); 
        background: #ffffff; 
        box-shadow: 0 0 0 4px rgba(27, 67, 50, 0.14); 
        transform: translateY(-1px);
    }

    /* 🌟 Readonly State Styling 🌟 */
    .readonly-field {
        background: var(--cream-alt) !important;
        color: var(--muted) !important;
        cursor: not-allowed !important;
        border-color: var(--border) !important;
    }
    
    /* 🌟 Digital Counter Box (Total Quantity) 🌟 */
    .qty-box { 
        background: var(--gold-soft); 
        border: 2px dashed var(--gold); 
        padding: 18px 20px; 
        border-radius: 14px; 
        text-align: center; 
        margin-bottom: 24px;
        transition: all 0.25s ease;
        box-sizing: border-box;
    }
    .qty-box:hover {
        border-color: var(--forest);
        background: var(--forest-soft); 
    }
    .qty-box span { 
        font-size: 11.5px; 
        color: #7c4a12; 
        font-weight: 800; 
        display: block; 
        margin-bottom: 4px; 
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .qty-box input { 
        background: transparent; 
        border: none; 
        font-size: 40px; 
        font-weight: 900; 
        text-align: center; 
        width: 100%; 
        outline: none; 
        color: var(--forest-dark);
        font-variant-numeric: tabular-nums;
    }
    
    /* 🌟 Submit Button 🌟 */
    .submit-btn { 
        width: 100%; 
        background: linear-gradient(135deg, var(--forest), var(--forest-dark)); 
        color: #f8f5ec; 
        border: 1.5px solid var(--gold); 
        padding: 15px; 
        border-radius: 10px; 
        font-weight: 800; 
        font-size: 15.5px; 
        cursor: pointer; 
        transition: all 0.25s ease; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        box-shadow: 0 8px 18px rgba(27, 67, 50, 0.24);
    }
    .submit-btn:hover { 
        background: var(--gold); 
        color: var(--charcoal);
        border-color: #a6823c;
        transform: translateY(-2px); 
        box-shadow: 0 12px 22px rgba(197, 160, 89, 0.35); 
    }
    .submit-btn:active {
        transform: translateY(1px);
        box-shadow: 0 4px 10px rgba(27, 67, 50, 0.2);
    }

    /* 🌟 Royal Alert Modal 🌟 */
    .modal-overlay { 
        display: none; 
        position: fixed; 
        top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(18, 45, 34, 0.72); 
        z-index: 1000; 
        align-items: center; 
        justify-content: center; 
        backdrop-filter: blur(4px); 
        animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .modal-content { 
        background: var(--cream-card); 
        border: 2px solid var(--forest);
        border-top: 5px solid var(--gold);
        padding: 32px 28px; 
        border-radius: 18px; 
        text-align: center; 
        width: 90%;
        max-width: 350px; 
        box-shadow: 0 25px 50px -12px rgba(18, 45, 34, 0.38); 
        animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        box-sizing: border-box;
    }
    @keyframes scaleUp { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .modal-btn {
        background: var(--forest);
        color: #f8f5ec;
        border: 1.5px solid var(--gold);
        padding: 12px 28px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        width: 100%;
        transition: 0.2s;
    }
    .modal-btn:hover { background: var(--gold); color: var(--charcoal); border-color: #a6823c; }

    /* 📱 MOBILE RESPONSIVENESS 📱 */
    @media (max-width: 768px) {
        body { padding: 20px 10px; }
        .form-box { padding: 24px 18px; border-radius: 14px; }
        .title-row h2 { font-size: 19px; }
        .title-icon { padding: 8px 10px; font-size: 19px; }
        .row-2 { flex-direction: column; gap: 0; }
        .form-group { margin-bottom: 16px; }
        .custom-input, .custom-select { padding: 12px 14px; font-size: 14px; }
        .qty-box { padding: 14px; margin-bottom: 18px; }
        .qty-box input { font-size: 32px; }
        .submit-btn { padding: 14px; font-size: 14px; }
    }
  </style>

  gtag('js', new Date());

</script>

</head>
<body>

  <div class="modal-overlay" id="alertModal">
    <div class="modal-content">
      <div id="alertIcon" style="font-size: 48px; margin-bottom: 14px;">✅</div>
      <h3 id="alertTitle" style="font-family:'Cinzel', serif; margin: 0 0 10px 0; color: #122d22; font-size: 21px; font-weight: 800;">Success</h3>
      <p id="alertMsg" style="color: #525d56; font-size: 14.5px; font-weight: 600; margin-bottom: 24px; line-height: 1.5;">Message</p>
      <button class="modal-btn" onclick="document.getElementById('alertModal').style.display='none'">Got it</button>
    </div>
  </div>

  <div class="form-box">
    <div class="title-row">
      <div class="title-icon">📥</div>
      <h2>DM Master Stock</h2>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>District</label>
        <input type="text" id="districtName" class="custom-input readonly-field" readonly placeholder="Fetching District...">
      </div>
      <div class="form-group">
        <label>DM Name</label>
        <input type="text" id="dmName" class="custom-input readonly-field" readonly placeholder="Fetching Name...">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Start Serial No.</label>
        <input type="text" id="startSerial" class="custom-input" placeholder="Ex: AP-A0001" oninput="this.value = this.value.toUpperCase()">
      </div>
      <div class="form-group">
        <label>End Serial No.</label>
        <input type="text" id="endSerial" class="custom-input" placeholder="Ex: AP-A1000" oninput="this.value = this.value.toUpperCase()">
      </div>
    </div>

    <div class="qty-box">
      <span>Total Received Quantity</span>
      <input type="text" id="totalQty" value="0" readonly style="cursor: not-allowed;">
    </div>

    <button class="submit-btn" id="btnSubmit" onclick="addMasterStock()">Save Master Stock</button>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec";
    
    // 🌟 AUTO-FILL LOGIC ON PAGE LOAD 🌟
    document.addEventListener("DOMContentLoaded", () => {
        let savedDmName = localStorage.getItem("userName") || "State User"; 
        let savedDistrict = localStorage.getItem("userDistrict") || "Visakhapatnam";

        document.getElementById('dmName').value = savedDmName;
        document.getElementById('districtName').value = savedDistrict;
    });

    document.getElementById('endSerial').addEventListener('blur', function() {
       let start = document.getElementById('startSerial').value;
       let end = this.value;
       let startNum = parseInt(start.replace(/[^0-9]/g, ''));
       let endNum = parseInt(end.replace(/[^0-9]/g, ''));
       if(!isNaN(startNum) && !isNaN(endNum) && endNum >= startNum) {
           let qty = (endNum - startNum) + 1;
           document.getElementById('totalQty').value = new Intl.NumberFormat('en-IN').format(qty);
       } else {
           document.getElementById('totalQty').value = 0;
       }
    });

    function addMasterStock() {
      let district = document.getElementById('districtName').value;
      let dmName = document.getElementById('dmName').value.trim();
      let startSerial = document.getElementById('startSerial').value.trim();
      let endSerial = document.getElementById('endSerial').value.trim();
      let qtyStr = document.getElementById('totalQty').value.replace(/,/g, '');
      let qty = parseInt(qtyStr) || 0;

      if(!district || !dmName || !startSerial || !endSerial || qty <= 0) {
         showAlert("⚠️", "Validation Failed", "దయచేసి సీరియల్ నంబర్లు సరిగ్గా నింపండి.");
         return;
      }

      let btn = document.getElementById('btnSubmit');
      btn.innerHTML = "⏳ Saving...";
      btn.style.opacity = "0.7";
      btn.style.pointerEvents = "none";

      let payload = { action: "addMasterStock", district: district, dmName: dmName, startSerial: startSerial, endSerial: endSerial, quantity: qty };

      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(res => {
         btn.innerHTML = "Save Master Stock";
         btn.style.opacity = "1";
         btn.style.pointerEvents = "auto";
         
         if(res.success) {
            showAlert("🎉", "Saved Successfully!", res.message);
            document.getElementById('startSerial').value = "";
            document.getElementById('endSerial').value = "";
            document.getElementById('totalQty').value = "0";
         } else {
            showAlert("❌", "Error", res.message);
         }
      })
      .catch(err => {
         btn.innerHTML = "Save Master Stock";
         btn.style.opacity = "1";
         btn.style.pointerEvents = "auto";
         showAlert("🌐", "Network Error", "సర్వర్‌కి కనెక్ట్ అవ్వడం లేదు.");
      });
    }

    function showAlert(icon, title, msg) {
      document.getElementById('alertIcon').innerText = icon;
      document.getElementById('alertTitle').innerText = title;
      document.getElementById('alertMsg').innerText = msg;
      
      let modalBtn = document.querySelector('.modal-btn');
      if(icon === "❌" || icon === "⚠️" || icon === "🌐") {
          modalBtn.style.background = '#b91c1c';
          modalBtn.style.color = '#ffffff';
          modalBtn.style.border = '1.5px solid #991b1b';
      } else {
          modalBtn.style.background = '#1b4332';
          modalBtn.style.color = '#f8f5ec';
          modalBtn.style.border = '1.5px solid #c5a059';
      }
      
      document.getElementById('alertModal').style.display = 'flex';
    }
  </script>
</body>
</html>
