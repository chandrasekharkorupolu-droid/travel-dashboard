<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request New Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <style>
    /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
    :root {
      --cream-bg: #f4f1e6;
      --cream-card: #faf8f2;
      --cream-alt: #f0ece0;
      --forest: #1b4332;
      --forest-dark: #122d22;
      --forest-soft: #e9f2ed;
      --gold: #c5a059;
      --gold-soft: #f7efe0;
      --charcoal: #141a17;
      --muted: #525d56;
      --border: #d5cfbe;
    }

    /* 🌟 Master Clean Background 🌟 */
    body { 
        background: var(--cream-bg); 
        font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif; 
        color: var(--charcoal);
        padding: 40px 20px; 
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* 🌟 Premium Solid Card 🌟 */
    .premium-card {
        background: var(--cream-card);
        border: 1.5px solid var(--forest);
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(27, 67, 50, 0.12), 0 4px 12px rgba(27, 67, 50, 0.06);
        width: 100%;
        max-width: 550px;
        position: relative;
        animation: slideUp 0.4s ease-out;
        border-top: 6px solid var(--gold);
        overflow: hidden;
    }

    @keyframes slideUp { 
        from { transform: translateY(20px); opacity: 0; } 
        to { transform: translateY(0); opacity: 1; } 
    }

    /* 🌟 Header Section 🌟 */
    .card-header-custom {
        background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
        padding: 22px 28px;
        border-bottom: 3px solid var(--gold);
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .title-icon {
        background: rgba(197, 160, 89, 0.18);
        border: 1.5px solid var(--gold);
        padding: 9px 11px;
        border-radius: 12px;
        font-size: 20px;
        color: #e6c885;
        line-height: 1;
    }

    .card-title {
        font-family: 'Cinzel', serif;
        color: #f8f5ec;
        font-weight: 800;
        font-size: 20px;
        margin: 0;
        letter-spacing: 0.6px;
        text-transform: uppercase;
    }

    /* 🌟 Form Body & Inputs 🌟 */
    .card-body-custom { padding: 28px 30px; }

    .form-group { margin-bottom: 24px; }
    
    .form-label-custom {
        display: block;
        font-size: 12.5px;
        font-weight: 800;
        color: var(--forest-dark);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* 🌟 Custom Input Group for Prefix (COL) 🌟 */
    .input-group-custom {
        display: flex;
        align-items: center;
        background: #ffffff;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition: all 0.25s ease;
    }

    .input-group-custom:focus-within {
        background: #ffffff;
        border-color: var(--forest);
        box-shadow: 0 0 0 4px rgba(27, 67, 50, 0.14);
        transform: translateY(-1px);
    }

    .input-prefix {
        background: var(--forest);
        color: #e6c885;
        font-weight: 900;
        padding: 13px 16px;
        font-size: 15.5px;
        border-right: 2px solid var(--gold);
        letter-spacing: 0.8px;
    }

    .form-control-input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 15.5px;
        font-weight: 700;
        color: var(--charcoal);
        padding: 13px 16px;
        outline: none;
        letter-spacing: 1px;
    }

    .form-control-input::placeholder { color: #8f8873; font-weight: 500; letter-spacing: normal; }

    .form-control-custom {
        width: 100%;
        background: #ffffff;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 15.5px;
        font-weight: 700;
        color: var(--charcoal);
        padding: 13px 16px;
        transition: all 0.25s ease;
        outline: none;
    }

    .form-control-custom:focus {
        background: #ffffff;
        border-color: var(--forest);
        box-shadow: 0 0 0 4px rgba(27, 67, 50, 0.14);
        transform: translateY(-1px);
    }

    .form-control-custom::placeholder { color: #8f8873; font-weight: 500; }

    /* 🌟 Submit Button 🌟 */
    .btn-submit {
        width: 100%;
        background: linear-gradient(135deg, var(--forest), var(--forest-dark));
        color: #f8f5ec;
        border: 1.5px solid var(--gold);
        border-radius: 10px;
        padding: 15px;
        font-size: 15.5px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 6px 16px rgba(27, 67, 50, 0.22);
        margin-top: 8px;
    }

    .btn-submit:hover {
        background: var(--gold);
        color: var(--charcoal);
        border-color: #a6823c;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(197, 160, 89, 0.35);
    }

    .btn-submit:active {
        transform: translateY(1px);
        box-shadow: 0 4px 8px rgba(27, 67, 50, 0.2);
    }

    .btn-submit:disabled {
        background: var(--border);
        color: var(--muted);
        border-color: var(--border);
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
    }

    /* 🌟 Premium Alert Modal 🌟 */
    .modal-content-innovative {
        background: var(--cream-card);
        border: 2px solid var(--forest);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(18, 45, 34, 0.3);
        text-align: center;
        padding: 36px 28px;
    }
    
    .icon-circle { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 36px; }
    .icon-circle.success { background-color: var(--forest-soft); color: #15803d; border: 2px solid var(--gold); box-shadow: 0 0 22px rgba(27, 67, 50, 0.16); } 
    .icon-circle.error { background-color: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5; box-shadow: 0 0 22px rgba(185, 28, 28, 0.16); }

    .alert-message-text { font-size: 15px; font-weight: 600; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }

    .btn-modal {
        border-radius: 10px; padding: 13px 28px; font-weight: 800; font-size: 15px; transition: all 0.25s ease; border: none; width: 75%; margin: 0 auto; letter-spacing: 0.5px;
    }
    .btn-modal.success { background: linear-gradient(135deg, var(--forest), var(--forest-dark)); color: #f8f5ec; border: 1.5px solid var(--gold); box-shadow: 0 6px 14px rgba(27, 67, 50, 0.22); }
    .btn-modal.error { background: linear-gradient(135deg, #b91c1c, #991b1b); color: #ffffff; box-shadow: 0 6px 14px rgba(185, 28, 28, 0.22); }
    .btn-modal:hover { transform: translateY(-2px); }

    /* 📱 MOBILE RESPONSIVE STYLES 📱 */
    @media (max-width: 768px) {
        body { padding: 20px 10px; }
        .premium-card { border-radius: 16px; }
        .card-header-custom { padding: 18px 20px; }
        .title-icon { font-size: 18px; padding: 8px 10px; }
        .card-title { font-size: 17px; }
        .card-body-custom { padding: 20px; }
        .form-control-custom, .input-prefix, .form-control-input { padding: 12px 14px; font-size: 15px; }
        .btn-submit { padding: 14px; font-size: 14.5px; }
        .modal-content-innovative { padding: 28px 20px; margin: 10px; }
        .icon-circle { width: 64px; height: 64px; font-size: 30px; margin-bottom: 14px; }
        #alertTitle { font-size: 21px !important; }
        .alert-message-text { font-size: 14px; margin-bottom: 20px; }
        .btn-modal { width: 100%; padding: 12px 20px; font-size: 14.5px; }
    }
  </style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-GF2VXY76KN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GF2VXY76KN');
</script>
</head>
<body>

  <div class="modal fade" id="customAlertModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-innovative">
        <div id="alertIconContainer" class="icon-circle success">✅</div>
        <h4 id="alertTitle" class="fw-bold mb-3" style="font-family:'Cinzel', serif; color:#122d22; font-size: 24px; letter-spacing: 0.3px;">Success!</h4>
        <p id="alertMessage" class="alert-message-text">Message goes here.</p>
        <button type="button" id="alertBtn" class="btn-modal success" data-bs-dismiss="modal">OK, Got it!</button>
      </div>
    </div>
  </div>

  <div class="premium-card">
    <div class="card-header-custom">
      <div class="title-icon">📦</div>
      <h2 class="card-title">Request New Stock</h2>
    </div>
    
    <div class="card-body-custom">
      <div class="form-group">
        <label class="form-label-custom">Stock Holding Request No (SHQ)</label>
        <div class="input-group-custom">
            <span class="input-prefix">COL</span>
            <input type="text" id="shqNo" class="form-control-input" placeholder="Ex: 0907202675252" maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label-custom">Required Quantity (Papers)</label>
        <input type="number" id="reqQty" class="form-control-custom" placeholder="Ex: 100">
      </div>
      
      <button id="btnReqStock" class="btn-submit" onclick="submitRequest()">Submit Request</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec";
    let loggedInId = localStorage.getItem("userId") || "";
    let loggedInUser = localStorage.getItem("userName") || "";

    function customAlert(msg, isSuccess) {
        let safeMsg = msg ? String(msg) : (isSuccess ? "Request Submitted Successfully." : "Request Failed!");
        const iconContainer = document.getElementById("alertIconContainer");
        const title = document.getElementById("alertTitle");
        const message = document.getElementById("alertMessage");
        const btn = document.getElementById("alertBtn");

        if (isSuccess) {
            iconContainer.className = "icon-circle success"; iconContainer.innerHTML = "✅"; 
            title.innerText = "Superb!"; 
            title.style.color = "#122d22";
            btn.className = "btn-modal success"; btn.innerText = "OK, Great!";
        } else {
            iconContainer.className = "icon-circle error"; iconContainer.innerHTML = "❌"; 
            title.innerText = "Oh Snap!"; 
            title.style.color = "#b91c1c";
            btn.className = "btn-modal error"; btn.innerText = "Try Again";
        }
        
        message.innerHTML = safeMsg.replace(/\n/g, '<br>');
        var alertModal = new bootstrap.Modal(document.getElementById('customAlertModal'));
        alertModal.show();
    }

    function submitRequest() {
        var shqInput = document.getElementById('shqNo').value.trim(); 
        var qty = document.getElementById('reqQty').value;
        
        // 🌟 Validation: ఖచ్చితంగా 13 అంకెలు ఉండాలి 🌟
        if(shqInput.length !== 13) { 
            customAlert("దయచేసి సరైన Stock Holding Number ని ఎంటర్ చేయండి. \n(ఖచ్చితంగా 13 అంకెలు ఉండాలి!)", false); 
            return; 
        } 
        
        // సబ్మిట్ చేసేటప్పుడు COL కి నెంబర్ యాడ్ చేసి పంపిస్తున్నాం (e.g., COL0907202675252)
        var finalShqNo = "COL" + shqInput;

        if(!qty || qty <= 0) { customAlert("దయచేసి ఎన్ని పేపర్లు కావాలో కరెక్ట్ గా ఎంటర్ చేయండి!", false); return; }
        
        var btn = document.getElementById('btnReqStock'); 
        btn.innerText = "⏳ Submitting..."; 
        btn.disabled = true;
        
        fetch(SCRIPT_URL, { 
            method: "POST", 
            body: JSON.stringify({ action: 'vleRequestStock', vleId: loggedInId, vleName: loggedInUser, quantity: qty, shqNo: finalShqNo }) 
        })
        .then(res => res.json())
        .then(res => { 
            btn.innerText = "Submit Request"; 
            btn.disabled = false; 
            if(res.success) { 
                customAlert(res.message, true); 
                document.getElementById('shqNo').value = ''; 
                document.getElementById('reqQty').value = ''; 
            } else { 
                customAlert(res.message, false); 
            } 
        })
        .catch(err => { 
            btn.innerText = "Submit Request"; 
            btn.disabled = false; 
            customAlert("Network Error! Please check your connection.", false); 
        });
    }
  </script>
</body>
</html>
