<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise a Ticket & Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
        :root {
            --cream-bg: #f4f1e6;
            --cream-card: #faf8f2;
            --cream-alt: #f0ece0;
            --forest: #1b4332;
            --forest-dark: #122d22;
            --forest-soft: #e9f2ed;
            --primary-gold: #c5a059;
            --hover-gold: #a6823c;
            --gold-soft: #f7efe0;
            --text-dark: #141a17;
            --muted: #525d56;
            --border-color: #d5cfbe;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--cream-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .main-wrapper { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* 🌟 Stats Cards Layout 🌟 */
        .stats-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-card {
            flex: 1;
            min-width: 150px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(27, 67, 50, 0.06);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--forest);
            background: var(--cream-card);
        }
        .stat-card h3 { margin: 0 0 6px 0; font-size: 11.5px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card h1 { margin: 0; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
        .card-total { border-top-color: var(--forest); color: var(--forest); }
        .card-pending { border-top-color: #b45309; color: #b45309; }
        .card-resolved { border-top-color: #15803d; color: #15803d; }

        /* 🌟 Form & History Layout with Smooth Transition 🌟 */
        .content-grid { display: grid; grid-template-columns: 1fr; gap: 22px; transition: all 0.4s ease-in-out; }
        @media(min-width: 768px) { .content-grid { grid-template-columns: 480px 1fr; } } 
        
        .helpdesk-card {
            background: var(--cream-card);
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(27, 67, 50, 0.08);
            border: 1.5px solid var(--forest);
            border-top: 5px solid var(--primary-gold);
            animation: fadeIn 0.3s;
            height: fit-content;
            transition: all 0.4s ease;
            overflow: hidden;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-header {
            padding: 15px 22px;
            background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
            border-bottom: 3px solid var(--primary-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h2 {
            font-family: 'Cinzel', serif;
            margin: 0;
            color: #e6c885;
            font-size: 16.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-body { padding: 22px; }
        
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--forest-dark);
            font-size: 12.5px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        select, input[type="text"], input[type="number"], input[type="date"], textarea, input[type="file"] {
            width: 100%;
            padding: 11px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-family: inherit;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--forest);
            box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.14);
            background-color: #ffffff;
        }
        input[readonly] { background-color: var(--cream-alt); color: var(--muted); cursor: not-allowed; border-color: var(--border-color); }
        
        .file-hint { display: block; font-size: 11.5px; color: #b91c1c; margin-top: 5px; font-weight: 800; }
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--forest), var(--forest-dark));
            color: #f8f5ec;
            border: 1.5px solid var(--primary-gold);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 10px;
            text-transform: uppercase;
            box-shadow: 0 6px 14px rgba(27, 67, 50, 0.22);
        }
        .submit-btn:hover { background: var(--primary-gold); color: var(--text-dark); border-color: var(--hover-gold); transform: translateY(-1px); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .required-star { color: #b91c1c; }

        /* 🌟 Toggle Buttons 🌟 */
        .toggle-btn {
            background: var(--primary-gold);
            border: 1.5px solid var(--hover-gold);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 800;
            color: var(--text-dark);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .toggle-btn:hover { background: #e6c885; color: var(--forest-dark); }

        /* 🌟 History Table Design 🌟 */
        .history-card {
            background: var(--cream-card);
            border-radius: 14px;
            border: 1.5px solid var(--forest);
            border-top: 5px solid var(--primary-gold);
            box-shadow: 0 6px 20px rgba(27, 67, 50, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.4s ease;
            transform-origin: right;
        }
        .table-container { overflow-x: auto; width: 100%; max-height: 700px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }
        th {
            background-color: var(--forest);
            color: #f8f5ec;
            padding: 12px 14px;
            font-size: 11.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid var(--primary-gold);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th:last-child { border-right: none; }
        td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid #e6e1d3;
            font-size: 13px;
            color: var(--text-dark);
            background-color: var(--cream-card);
        }
        tbody tr:nth-child(even) td { background-color: var(--cream-alt); }
        tbody tr:hover td { background-color: var(--gold-soft) !important; }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 800; display: inline-block; text-transform: uppercase; }
        .status-pending { background-color: var(--gold-soft); color: #92400e; border: 1px solid #dfc48e; }
        .status-resolved { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        #loadingMsg { text-align: center; padding: 40px; font-size: 14px; color: var(--forest); font-weight: 800; }

        /* 🌟 Royal Modals 🌟 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 45, 34, 0.72); display: flex; justify-content: center;
            align-items: center; z-index: 1000; backdrop-filter: blur(3px);
        }
        .modal-content {
            background: var(--cream-card); padding: 30px; border-radius: 16px; text-align: center;
            max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--forest); border-top: 6px solid var(--primary-gold);
        }
        .modal-btn {
            background-color: var(--forest); color: #f8f5ec; border: 1.5px solid var(--primary-gold);
            padding: 10px 32px; border-radius: 8px; font-size: 15px; font-weight: 800;
            cursor: pointer; margin-top: 15px; transition: 0.2s;
        }
        .modal-btn:hover { background-color: var(--primary-gold); color: var(--text-dark); }

        /* 📱 MOBILE RESPONSIVE STYLES 📱 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .main-wrapper { gap: 14px; }
            
            .stats-container { gap: 10px; }
            .stat-card { flex: 1 1 calc(50% - 10px); min-width: 140px; padding: 12px; }
            .stat-card h1 { font-size: 22px; }
            
            .card-header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; }
            .card-header h2 { font-size: 15px; }
            .toggle-btn { width: 100%; justify-content: center; padding: 9px; }
            
            .card-body { padding: 16px; }
            select, input[type="text"], input[type="number"], input[type="date"], textarea, input[type="file"] {
                padding: 10px; font-size: 13px;
            }
            .submit-btn { padding: 12px; font-size: 14px; }
            
            .table-container { -webkit-overflow-scrolling: touch; }
            th, td { white-space: nowrap; padding: 10px; font-size: 12px; }
            .modal-content { padding: 24px 20px; }
        }
    </style>

<body>

<div class="main-wrapper">
    
    <div class="stats-container">
        <div class="stat-card card-total">
            <h3>My Total Tickets</h3>
            <h1 id="countTotal">0</h1>
        </div>
        <div class="stat-card card-pending">
            <h3>Pending Tickets</h3>
            <h1 id="countPending">0</h1>
        </div>
        <div class="stat-card card-resolved">
            <h3>Resolved Tickets</h3>
            <h1 id="countResolved">0</h1>
        </div>
    </div>

    <!-- MAIN GRID CONTAINER -->
    <div class="content-grid" id="mainGrid">
        
        <!-- LEFT SIDE: RAISE TICKET FORM -->
        <div class="helpdesk-card" id="formCard">
            <div class="card-header">
                <h2>🎧 RAISE NEW TICKET</h2>
                <button id="showHistoryBtn" class="toggle-btn" style="display:none;" onclick="toggleHistory()">
                    <span>📜 Show History</span>
                </button>
            </div>
            <div class="card-body">
                <form id="ticketForm" onsubmit="submitTicket(event)">
                    <div class="form-group">
                        <label for="serviceSelect">Select Service <span class="required-star">*</span></label>
                        <select id="serviceSelect" onchange="loadIssues()" required>
                            <option value="">-- Choose Service --</option>
                            <option value="IRCTC">IRCTC</option>
                            <option value="REDBUS">REDBUS</option>
                            <option value="AIRWAYS">AIRWAYS</option>
                            <option value="APSRTC">APSRTC</option>
                        </select>
                    </div>
                    <div class="form-group" id="issueDiv" style="display:none;">
                        <label for="issueSelect">Issue Category <span class="required-star">*</span></label>
                        <select id="issueSelect" onchange="loadFields()" required>
                            <option value="">-- Choose Issue --</option>
                        </select>
                    </div>
                    <div id="dynamicFields"></div>
                    <button type="submit" class="submit-btn" id="submitBtn" style="display:none;">Submit Ticket</button>
                </form>
            </div>
        </div>

        <!-- RIGHT SIDE: TICKETS HISTORY -->
        <div class="history-card" id="historyCard">
            <div class="card-header">
                <h2>📋 MY TICKETS HISTORY</h2>
                <button class="toggle-btn" onclick="toggleHistory()" title="Hide History to expand form">
                    Hide ➡️
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Date & Time</th>
                            <th>Service & Issue</th>
                            <th>Status</th>
                            <th>Resolution Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="vleTicketsBody">
                    </tbody>
                </table>
                <div id="loadingMsg">⏳ Fetching your ticket history...</div>
            </div>
        </div>

    </div>
</div>

<!-- SUCCESS MODAL -->
<div id="successModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div style="font-size: 48px; margin-bottom: 10px;">✅</div>
        <h3 style="font-family:'Cinzel', serif; color: #122d22; margin-top: 0;">Ticket Raised Successfully!</h3>
        <p style="color: #525d56; font-size: 15.5px; font-weight: bold; margin: 10px 0;">Ticket No: <span style="color: #7c4a12;"></span></p>
        <button type="button" onclick="closeModal()" class="modal-btn">OK</button>
    </div>
</div>

<!-- ERROR MODAL -->
<div id="errorModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="border-top: 6px solid #b91c1c;">
        <div style="font-size: 48px; margin-bottom: 10px;">❌</div>
        <h3 style="font-family:'Cinzel', serif; color: #b91c1c; margin-top: 0;">Failed!</h3>
        <p id="errorMsgText" style="color: #525d56; font-size: 14.5px; font-weight: bold; margin: 10px 0;"></p>
        <button type="button" onclick="closeErrorModal()" class="modal-btn" style="background-color: #b91c1c; border-color: #991b1b;">OK</button>
    </div>
</div>

<script>
    const loggedInVLE = { 
        cscId: localStorage.getItem("userId") || "", 
        vleName: localStorage.getItem("userName") || "", 
        district: localStorage.getItem("userDistrict") || "AP",
        irctcId: "", 
        mobile: "" 
    };

    const scriptURL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec"; 

    // 🌟 1. TOGGLE HISTORY LOGIC 🌟
    function toggleHistory() {
        const historyCard = document.getElementById("historyCard");
        const grid = document.getElementById("mainGrid");
        const showBtn = document.getElementById("showHistoryBtn");

        if (historyCard.style.display === "none") {
            historyCard.style.display = "flex";
            grid.style.gridTemplateColumns = window.innerWidth >= 768 ? "480px 1fr" : "1fr";
            showBtn.style.display = "none";
        } else {
            historyCard.style.display = "none";
            grid.style.gridTemplateColumns = "1fr";
            showBtn.style.display = "inline-flex";
        }
    }

    // 🌟 2. FETCH AGENT ID 🌟
    function fetchAgentId() {
        if (loggedInVLE.cscId && !loggedInVLE.irctcId) {
            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: "getIrctcId", cscId: loggedInVLE.cscId })
            })
            .then(res => res.json())
            .then(result => {
                if (result.success && result.irctcId) {
                    loggedInVLE.irctcId = result.irctcId; 
                    let input = document.querySelector('input[data-key="irctcId"]');
                    if (input && input.value === "") {
                        input.value = result.irctcId;
                        input.setAttribute("readonly", "true");
                        input.style.backgroundColor = "#f0ece0";
                        input.style.cursor = "not-allowed";
                    }
                }
            }).catch(e => console.log("Fetch Error:", e));
        }
    }

    // 🌟 3. FETCH DASHBOARD & HISTORY 🌟
    async function loadVLEDashboard() {
        if (!loggedInVLE.cscId) {
            document.getElementById("loadingMsg").innerText = "⚠️ User ID not found. Please login again.";
            return;
        }
        try {
            let response = await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: "getVLETickets", cscId: loggedInVLE.cscId })
            });
            let result = await response.json();
            
            if (result.success) {
                document.getElementById("countTotal").innerText = result.stats.total;
                document.getElementById("countPending").innerText = result.stats.pending;
                document.getElementById("countResolved").innerText = result.stats.resolved;

                const tbody = document.getElementById("vleTicketsBody");
                tbody.innerHTML = "";

                if (result.tickets.length === 0) {
                    document.getElementById("loadingMsg").innerText = "🎉 No tickets raised yet!";
                    document.getElementById("loadingMsg").style.display = "block";
                } else {
                    document.getElementById("loadingMsg").style.display = "none";
                    result.tickets.forEach(t => {
                        let statusClass = t.status.toUpperCase() === "PENDING" ? "status-pending" : "status-resolved";
                        let remarksColor = t.status.toUpperCase() === "PENDING" ? "#b45309" : "#15803d";
                        let tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td style="font-weight:800; color:#1b4332;">${t.ticketId}</td>
                            <td style="font-size:12px; color:#525d56; font-weight:600;">${t.date}</td>
                            <td><span style="color:#7c4a12; font-weight:800;">${t.service}</span><br><span style="font-size:11px; color:#525d56; font-weight:600;">${t.issue}</span></td>
                            <td><span class="status-badge ${statusClass}">${t.status}</span></td>
                            <td style="color:${remarksColor}; font-weight:700; font-size:12px;">${t.remarks}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } else {
                document.getElementById("loadingMsg").innerText = "❌ Failed to fetch data. Server Error.";
            }
        } catch (e) { 
            console.log("Dashboard Error:", e);
            document.getElementById("loadingMsg").innerText = "❌ Connection Failed. Please deploy Code.gs properly.";
        }
    }

    window.addEventListener('load', () => {
        fetchAgentId();
        loadVLEDashboard();
    });

    const helpdeskData = {
        "IRCTC": {
            "New Registration Done - But ID not generated": [{ label: "CSC ID", type: "text", required: true, autoFillKey: "cscId" }, { label: "Date of Registration", type: "date", required: true }],
            "Password Reset": [{ label: "Agent ID (IRCTC ID)", type: "text", required: true, autoFillKey: "irctcId" }, { label: "CSC ID", type: "text", required: true, autoFillKey: "cscId" }],
            "Mobile No / Email Change": [{ label: "Agent ID", type: "text", required: true, autoFillKey: "irctcId" }, { label: "Old Mobile No", type: "number", required: true }, { label: "New Mobile No", type: "number", required: true }, { label: "Old Email ID", type: "text", required: true }, { label: "New Email ID", type: "text", required: true }],
            "No Refund after Cancellation": [{ label: "PNR No", type: "text", required: true }, { label: "Amount", type: "number", required: true }, { label: "Date of Cancellation", type: "date", required: true }],
            "Wrong Mobile No - OTP Not Received": [{ label: "PNR No", type: "text", required: true }, { label: "Passenger Name", type: "text", required: true }, { label: "Mobile No on PNR", type: "number", required: true }, { label: "Correct Mobile No", type: "number", required: true }, { label: "Upload Passenger Form", type: "file", hint: "Max 100 KB", required: true }, { label: "Upload ID Proof", type: "file", hint: "Full Aadhaar only - Max 100 KB", required: true }],
            "General": [{ label: "Date of Transaction", type: "date", required: true }, { label: "Amount", type: "number", required: true }, { label: "Issue Description", type: "textarea", required: true }, { label: "Upload Screenshot", type: "file", hint: "Max 100 KB", required: true }]
        },
        "REDBUS": {
            "No Refund After Cancellation": [{ label: "PNR No", type: "text", required: true }, { label: "Ticket No", type: "text", required: true }, { label: "Date of Cancellation", type: "date", required: true }, { label: "Amount", type: "number", required: true }],
            "Service Cancelled by Operator": [{ label: "PNR No", type: "text", required: true }, { label: "Ticket No", type: "text", required: true }, { label: "Date of Journey", type: "date", required: true }, { label: "Amount", type: "number", required: true }, { label: "Bus Travels Name", type: "text", required: true }],
            "Amount Debited Ticket Not Confirmed": [{ label: "Date of Transaction", type: "date", required: true }, { label: "Amount Debited", type: "number", required: true }, { label: "Upload Screenshot", type: "file", hint: "Max 100 KB", required: true }]
        },
        "AIRWAYS": {
            "No Refund After Cancellation": [{ label: "Cart No", type: "text", required: true }, { label: "PNR No", type: "text", required: true }, { label: "Date of Cancellation", type: "date", required: true }, { label: "Amount", type: "number", required: true }, { label: "Upload Cancellation Proof", type: "file", hint: "Max 100 KB", required: true }],
            "Flight Cancelled": [{ label: "Cart No", type: "text", required: true }, { label: "PNR No", type: "text", required: true }, { label: "Date of Journey", type: "date", required: true }, { label: "Amount", type: "number", required: true }, { label: "Airline Name", type: "text", required: true }, { label: "Upload Cancellation Proof", type: "file", hint: "Max 100 KB", required: true }],
            "Amount Debited Ticket Not Confirmed": [{ label: "Date of Transaction", type: "date", required: true }, { label: "Amount Debited", type: "number", required: true }, { label: "Upload Screenshot", type: "file", hint: "Max 100 KB", required: true }]
        },
        "APSRTC": {
            "No Refund After Cancellation": [{ label: "PNR No", type: "text", required: true }, { label: "Ticket No", type: "text", required: true }, { label: "Date of Cancellation", type: "date", required: true }, { label: "Amount", type: "number", required: true }],
            "Service Cancelled by Operator": [{ label: "PNR No", type: "text", required: true }, { label: "Ticket No", type: "text", required: true }, { label: "Date of Journey", type: "date", required: true }, { label: "Amount", type: "number", required: true }, { label: "Bus Service Name", type: "text", required: true }],
            "Amount Debited Ticket Not Confirmed": [{ label: "Date of Transaction", type: "date", required: true }, { label: "Amount Debited", type: "number", required: true }, { label: "Upload Screenshot", type: "file", hint: "Max 100 KB", required: true }]
        }
    };

    function loadIssues() {
        const service = document.getElementById("serviceSelect").value;
        const issueSelect = document.getElementById("issueSelect");
        const issueDiv = document.getElementById("issueDiv");
        const dynamicFields = document.getElementById("dynamicFields");
        const submitBtn = document.getElementById("submitBtn");

        issueSelect.innerHTML = '<option value="">-- Choose Issue --</option>';
        dynamicFields.innerHTML = '';
        submitBtn.style.display = "none";

        if(service === "IRCTC") fetchAgentId(); 

        if (service && helpdeskData[service]) {
            issueDiv.style.display = "block";
            Object.keys(helpdeskData[service]).forEach(issue => {
                issueSelect.appendChild(new Option(issue, issue));
            });
        } else { issueDiv.style.display = "none"; }
    }

    function loadFields() {
        const service = document.getElementById("serviceSelect").value;
        const issue = document.getElementById("issueSelect").value;
        const dynamicFields = document.getElementById("dynamicFields");
        const submitBtn = document.getElementById("submitBtn");

        dynamicFields.innerHTML = ''; 
        if (service && issue && helpdeskData[service][issue]) {
            helpdeskData[service][issue].forEach(field => {
                const div = document.createElement("div"); 
                div.className = "form-group";
                let autoFillAttr = '', autoFillValue = '', dataKeyAttr = '';
                
                if (field.autoFillKey) { dataKeyAttr = `data-key="${field.autoFillKey}"`; }
                
                if (field.autoFillKey === "cscId") {
                    autoFillValue = `value="${loggedInVLE.cscId}"`;
                    autoFillAttr = 'readonly';
                } else if (field.autoFillKey === "irctcId") {
                    if (loggedInVLE.irctcId) {
                        autoFillValue = `value="${loggedInVLE.irctcId}"`;
                        autoFillAttr = 'readonly';
                    } else {
                        autoFillValue = `placeholder="Enter Agent ID (Autofilling...)"`;
                        autoFillAttr = '';
                        fetchAgentId();
                    }
                }
                
                let inputHTML = '';
                if (field.type === "textarea") {
                    inputHTML = `<textarea rows="3" ${field.required ? 'required' : ''}></textarea>`;
                } else if (field.type === "file") {
                    inputHTML = `<input type="file" ${field.required ? 'required' : ''} accept=".jpg,.jpeg,.png,.pdf">`;
                } else {
                    inputHTML = `<input type="${field.type}" ${dataKeyAttr} ${autoFillValue} ${autoFillAttr} ${field.required ? 'required' : ''}>`;
                }

                const hintHTML = field.hint ? `<span class="file-hint">${field.hint}</span>` : '';
                div.innerHTML = `<label>${field.label} ${field.required ? '<span class="required-star">*</span>' : ''}</label>${inputHTML}${hintHTML}`;
                dynamicFields.appendChild(div);
            });
            submitBtn.style.display = "block";
        } else { submitBtn.style.display = "none"; }
    }

    async function submitTicket(event) {
        event.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;

        const service = document.getElementById("serviceSelect").value;
        const issue = document.getElementById("issueSelect").value;
        const dynamicDivs = document.getElementById("dynamicFields").children;

        let descriptionText = "";
        let filePromises = [];
        let filesData = [];

        for (let i = 0; i < dynamicDivs.length; i++) {
            let label = dynamicDivs[i].querySelector("label").innerText.replace('*', '').trim();
            let input = dynamicDivs[i].querySelector("input, select, textarea");
            
            if (input.type !== 'file') {
                descriptionText += label + ": " + input.value + "\n";
            } else {
                if (input.files.length > 0) {
                    let file = input.files[0];
                    
                    // 100 KB FILE SIZE VALIDATION 
                    if (file.size > 102400) { 
                        alert("File '" + file.name + "' is larger than 100 KB. Please upload a smaller file.");
                        submitBtn.innerText = "Submit Ticket";
                        submitBtn.disabled = false;
                        return;
                    }

                    let promise = new Promise((resolve) => {
                        let reader = new FileReader();
                        reader.onload = function(e) {
                            let base64 = e.target.result.split(',')[1];
                            filesData.push({ label: label, base64: base64, fileName: file.name, mimeType: file.type });
                            resolve();
                        };
                        reader.readAsDataURL(file);
                    });
                    filePromises.push(promise);
                } else { descriptionText += label + ": No file\n"; }
            }
        }

        if (filePromises.length > 0) { await Promise.all(filePromises); }

        const payload = {
            action: "raiseTicket",
            cscId: loggedInVLE.cscId,
            district: loggedInVLE.district, 
            service: service,
            issue: issue,
            description: descriptionText,
            files: filesData 
        };

        try {
            let response = await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            let result = await response.json();
            if (result.success) {
                document.querySelector("#successModal p span").innerText = result.ticketId;
                document.getElementById('successModal').style.display = 'flex';
                loadVLEDashboard();
            } else {
                document.getElementById("errorMsgText").innerText = result.message;
                document.getElementById('errorModal').style.display = 'flex';
            }
        } catch (error) {
            document.getElementById("errorMsgText").innerText = "Error: " + error;
            document.getElementById('errorModal').style.display = 'flex';
        } finally {
            submitBtn.innerText = "Submit Ticket";
            submitBtn.disabled = false;
        }
    }

    function closeModal() {
        document.getElementById('successModal').style.display = 'none';
        document.getElementById('ticketForm').reset();
        document.getElementById('dynamicFields').innerHTML = '';
        document.getElementById('issueDiv').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'none';
    }

    function closeErrorModal() { 
        document.getElementById('errorModal').style.display = 'none'; 
    }
</script>
</body>
