<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLE Details Editor - CSC TravelCloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 🌟 Royal Cream, Forest Green & Antique Gold Theme 🌟 */
        :root {
            --cream-bg: #f4f1e6;
            --cream-card: #faf8f2;
            --cream-alt: #f0ece0;
            --forest: #1b4332;
            --forest-dark: #122d22;
            --forest-soft: #e9f2ed;
            --gold: #c5a059;
            --gold-soft: #f7efe0;
            --charcoal: #141a17;
            --muted: #525d56;
            --border: #d5cfbe;
        }

        /* 🌟 Iframe Friendly Basic Settings 🌟 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--cream-bg); color: var(--charcoal); display: flex; flex-direction: column; min-height: 100vh; padding: 12px 15px; gap: 14px; }

        /* Top Controls */
        .top-controls {
            background-color: var(--cream-card); border-radius: 10px; border: 1.5px solid var(--forest); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 10px rgba(27,67,50,0.08); flex-shrink: 0;
        }
        .page-heading {
            font-family: 'Cinzel', serif; font-size: 19px; color: var(--forest); font-weight: 800;
            display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; text-transform: uppercase;
        }
        
        .btn-action {
            background-color: #ffffff; color: var(--forest); border: 1.5px solid var(--forest); padding: 8px 16px;
            border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s;
            box-shadow: 0 2px 0 var(--border);
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 0 transparent; }
        .btn-action:hover { background-color: var(--forest); color: #ffffff; }

        body.fullscreen-mode { padding: 10px; }

        /* Editor Container Layout */
        .editor-container {
            max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
        }

        /* Search Card */
        .search-card {
            background-color: var(--cream-card); padding: 26px; border-radius: 12px;
            box-shadow: 0 4px 16px rgba(27,67,50,0.08); border: 1.5px solid var(--forest);
            border-top: 4px solid var(--gold); text-align: center;
        }
        .search-title {
            font-family: 'Cinzel', serif; font-size: 16px; font-weight: 800; color: var(--forest-dark);
            margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.6px;
        }
        .search-input-group { display: flex; gap: 12px; justify-content: center; }
        .search-input {
            flex: 1; max-width: 450px; padding: 12px 18px; border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 14.5px; outline: none; font-weight: 700; background-color: #ffffff; color: var(--charcoal); transition: 0.2s;
        }
        .search-input:focus { border-color: var(--forest); background-color: #ffffff; box-shadow: 0 0 0 4px rgba(27, 67, 50, 0.12); }
        .search-input:disabled { background-color: var(--cream-alt); color: var(--muted); cursor: not-allowed; }
        
        .btn-find {
            background-color: var(--forest); color: #f8f5ec; border: 1.5px solid var(--forest-dark);
            padding: 12px 26px; border-radius: 8px; font-size: 14.5px; font-weight: 800; cursor: pointer;
            box-shadow: 0 3px 0 var(--forest-dark); transition: 0.2s;
        }
        .btn-find:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
        .btn-find:disabled { background-color: var(--border); color: var(--muted); border-color: var(--border); box-shadow: none; cursor: not-allowed; }
        .btn-find:hover:not(:disabled) { background-color: var(--gold); color: var(--charcoal); border-color: #a6823c; box-shadow: 0 3px 0 #8f6e30; }

        /* Editor Form Card */
        .editor-card {
            background-color: var(--cream-card); border-radius: 12px; box-shadow: 0 6px 22px rgba(27,67,50,0.1);
            border: 1.5px solid var(--forest); overflow: hidden; display: none; margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%); color: #e6c885;
            padding: 15px 25px; font-family: 'Cinzel', serif; font-size: 16px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.8px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 3px solid var(--gold);
        }
        
        .status-badge { padding: 4px 13px; border-radius: 20px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .status-active { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .status-inactive { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .status-never { background-color: var(--gold-soft); color: #92400e; border: 1px solid var(--gold); }
        .status-blocked { background-color: #ece8dc; color: var(--charcoal); border: 1px solid var(--border); }

        .form-grid { padding: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: span 2; }
        
        .form-group label { font-size: 11.5px; font-weight: 800; color: var(--forest-dark); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control {
            padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 14.5px;
            font-weight: 600; outline: none; background-color: #ffffff; transition: 0.2s; color: var(--charcoal);
        }
        .form-control:focus { border-color: var(--forest); background-color: #ffffff; box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.12); }
        .form-readonly { background-color: var(--cream-alt); color: var(--muted); border-color: var(--border); cursor: not-allowed; }

        /* Save Button Area */
        .form-actions {
            background-color: var(--cream-alt); padding: 18px 28px; border-top: 1.5px solid var(--border);
            display: flex; justify-content: flex-end; gap: 15px;
        }
        .btn-save {
            background-color: var(--gold); color: var(--charcoal); border: 1.5px solid #a6823c;
            padding: 12px 34px; border-radius: 7px; font-size: 14.5px; font-weight: 900; cursor: pointer;
            transition: 0.2s; box-shadow: 0 3px 0 #8f6e30; text-transform: uppercase; letter-spacing: 0.6px;
        }
        .btn-save:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
        .btn-save:disabled { background-color: var(--border); color: var(--muted); border-color: var(--border); box-shadow: none; cursor: not-allowed; }
        .btn-save:hover:not(:disabled) { background-color: var(--forest); color: #f8f5ec; border-color: var(--forest-dark); box-shadow: 0 3px 0 var(--forest-dark); }

        /* Toast Notification */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background-color: var(--forest-dark); color: #f8f5ec; border: 1.5px solid var(--gold);
            padding: 12px 26px; border-radius: 30px; font-size: 13.5px; font-weight: 700;
            z-index: 1000; display: none; box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }

        /* Access Denied Container */
        #accessDeniedMsg {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; background: var(--cream-card); border-radius: 12px;
            border: 2px solid var(--forest); padding: 50px; box-shadow: 0 6px 20px rgba(27,67,50,0.08);
        }
        #accessDeniedMsg h1 { font-family: 'Cinzel', serif; color: #b91c1c; font-size: 36px; margin-bottom: 10px; font-weight: 800; }
        #accessDeniedMsg p { font-size: 17px; color: var(--forest-dark); font-weight: 700; }
        #accessDeniedMsg span { font-size: 13.5px; color: var(--muted); margin-top: 6px; font-weight: 600; }

        /* 📱 MOBILE RESPONSIVE STYLES (మొబైల్ కోసం ప్రత్యేకమైన సెట్టింగ్స్) 📱 */
        @media (max-width: 768px) {
            body { padding: 10px; }

            .top-controls { flex-direction: column; gap: 10px; padding: 12px; }
            .page-heading { font-size: 15px; text-align: center; }
            #fullscreenBtn { display: none; }

            .search-card { padding: 16px; }
            .search-input-group { flex-direction: column; gap: 10px; }
            .search-input, .btn-find { width: 100%; max-width: 100%; }

            .form-grid { grid-template-columns: 1fr; padding: 20px; gap: 15px; }
            .form-group.full-width { grid-column: span 1; }

            .form-actions { padding: 15px 20px; flex-direction: column; gap: 10px; }
            .btn-save { width: 100%; padding: 12px; }
        }
    </style>

<body>

    <div class="top-controls" id="topControlsSection">
        <div class="page-heading">🛠️ VLE Information Editor & Corrector</div>
        <div class="filter-group">
            <button class="btn-action" id="fullscreenBtn" onclick="toggleFullScreen()">⛶ Full Screen</button>
        </div>
    </div>

    <div class="editor-container" id="editorMainSection">
        
        <div class="search-card">
            <div class="search-title">🔍 Search VLE to Update Details</div>
            <div class="search-input-group">
                <input type="text" id="vleSearchInput" class="search-input" placeholder="⏳ Loading Database... Please wait" disabled onkeypress="handleKeyPress(event)">
                <button class="btn-find" id="btnSearch" onclick="searchVLE()" disabled>Loading...</button>
            </div>
        </div>

        <div class="editor-card" id="editorFormCard">
            <div class="card-header">
                <span>📝 Edit Information</span>
                <span id="vleStatusBadge" class="status-badge">Active</span>
            </div>
            
            <div class="form-grid">
                
                <div class="form-group">
                    <label>CSC ID (Fixed Key)</label>
                    <input type="text" id="editCscId" class="form-control form-readonly" readonly>
                </div>
                
                <div class="form-group">
                    <label>VLE Name</label>
                    <input type="text" id="editVleName" class="form-control">
                </div>

                <div class="form-group">
                    <label>IRCTC ID</label>
                    <input type="text" id="editIrctcId" class="form-control">
                </div>

                <div class="form-group">
                    <label>Old District</label>
                    <input type="text" id="editOldDist" class="form-control">
                </div>

                <div class="form-group">
                    <label>New District</label>
                    <input type="text" id="editNewDist" class="form-control">
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" id="editMob" class="form-control">
                </div>

                <div class="form-group">
                    <label>VLE Mobile Number</label>
                    <input type="text" id="editVleMob" class="form-control">
                </div>

                <div class="form-group">
                    <label>District Manager Name</label>
                    <input type="text" id="editDmName" class="form-control form-readonly" readonly>
                </div>

                <div class="form-group full-width">
                    <label>HO Remarks <span style="color:#b91c1c; font-size:10px;">(Type suspend/block to disable VLE)</span></label>
                    <input type="text" id="editHoRemarks" class="form-control" placeholder="E.g. Suspend VLE ID due to inactivity">
                </div>

            </div>

            <div class="form-actions">
                <button class="btn-save" id="btnSaveChanges" onclick="saveVLEChanges()">Save Changes</button>
            </div>
        </div>

    </div> 
    
    <div id="accessDeniedMsg">
        <h1>🚫 Access Denied</h1>
        <p>You do not have permission to view or edit VLE details.</p>
        <span>Only State Head / SPOC can access this page.</span>
    </div>

    <div id="toast">✅ Details Updated Successfully!</div>

    <script>
        let globalVlesList = [];
        let selectedVleIndex = -1;
        let isDataReady = false; 
        
        const apiURL = "https://script.google.com/macros/s/AKfycby4S9U-tUh14QeZDI17UsOIOoEi5DMgORTWYllh1knGoeZQS_IJoavZWZ6RDWsD5uls/exec";

        window.onload = function() {
            let userDesignation = localStorage.getItem("userDesignation") || "State Head";
            
            if (userDesignation === "District Manager") {
                document.getElementById("topControlsSection").style.display = "none";
                document.getElementById("editorMainSection").style.display = "none";
                document.getElementById("accessDeniedMsg").style.display = "flex";
                return; 
            }
            
            fetchSheetData();
        };

        async function fetchSheetData() {
            try {
                let cachedData = sessionStorage.getItem("cscTravelData");
                let rawData;
                
                if (cachedData) {
                    rawData = JSON.parse(cachedData);
                } else {
                    let response = await fetch(apiURL);
                    rawData = await response.json();
                    sessionStorage.setItem("cscTravelData", JSON.stringify(rawData));
                }
                
                processVleData(rawData);
                
                document.getElementById("vleSearchInput").placeholder = "Enter CSC ID or IRCTC ID...";
                document.getElementById("vleSearchInput").disabled = false;
                document.getElementById("btnSearch").disabled = false;
                document.getElementById("btnSearch").innerText = "Fetch Details";
                isDataReady = true;

            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById("btnSearch").innerText = "❌ Error Loading Data";
                showToast("❌ Failed to connect with Google Sheet!");
            }
        }

        function processVleData(rawData) {
            if(!rawData || rawData.length === 0) return;
            
            let cleanHeaders = rawData[0].map(h => h ? h.toString().toLowerCase().replace(/[^a-z0-9]/g, '') : '');
            
            let idxcscid = cleanHeaders.findIndex(h => h.includes('cscid'));
            let idxirctc = cleanHeaders.findIndex(h => h.includes('irctcid'));
            let idxvlename = cleanHeaders.findIndex(h => h.includes('vlename') || h === 'name');
            let idxolddist = cleanHeaders.findIndex(h => h.includes('olddistrict'));
            let idxnewdist = cleanHeaders.findIndex(h => h.includes('newdistrict'));
            let idxmob = cleanHeaders.findIndex(h => h === 'mobile' || h.includes('mobileno'));
            let idxvlemob = cleanHeaders.findIndex(h => h.includes('vlemobile'));
            let idxho = cleanHeaders.findIndex(h => h.includes('horemarks'));
            let idxempname = cleanHeaders.findIndex(h => h.includes('employeename') || h.includes('empname'));
            
            let idx26 = cleanHeaders.findIndex(h => h.includes('202526') || h.includes('2526'));
            
            let mIndices = [];
            let idx27 = -1;
            
            if (idx26 > -1) {
                for (let k = 1; k <= 12; k++) {
                    if (idx26 + k < rawData[0].length) mIndices.push(idx26 + k);
                }
                if (idx26 + 13 < rawData[0].length) idx27 = idx26 + 13;
            }

            globalVlesList = [];

            for(let i=1; i<rawData.length; i++) {
                let row = rawData[i];
                let cscId = idxcscid > -1 ? (row[idxcscid] || '').toString().trim() : '';
                if(!cscId || cscId === '-') continue;

                let fy23 = cleanHeaders.findIndex(h => h.includes('2223')) > -1 ? (parseInt(row[cleanHeaders.findIndex(h => h.includes('2223'))]) || 0) : 0;
                let fy24 = cleanHeaders.findIndex(h => h.includes('2324')) > -1 ? (parseInt(row[cleanHeaders.findIndex(h => h.includes('2324'))]) || 0) : 0;
                let fy25 = cleanHeaders.findIndex(h => h.includes('2425')) > -1 ? (parseInt(row[cleanHeaders.findIndex(h => h.includes('2425'))]) || 0) : 0;
                let fy26 = idx26 > -1 ? (parseInt(row[idx26]) || 0) : 0;

                let monthSum = 0;
                mIndices.forEach(colIdx => {
                    if(colIdx > -1) monthSum += (parseInt(row[colIdx]) || 0);
                });
                let fy27Total = monthSum;
                if (fy27Total === 0 && idx27 > -1) {
                    fy27Total = parseInt(row[idx27]) || 0;
                }

                let hoRemarks = idxho > -1 ? (row[idxho] || '').toString() : '';
                let hoLower = hoRemarks.toLowerCase().trim();
                let status = 'active';

                let lifetimeTxns = fy23 + fy24 + fy25 + fy26 + fy27Total;

                if (hoLower.includes('suspend') || hoLower.includes('blacklist') || hoLower.includes('block')) {
                    status = 'blocked';
                } else if (lifetimeTxns === 0) {
                    status = 'never';
                } else if (fy27Total === 0) {
                    status = 'inactive';
                }

                globalVlesList.push({
                    cscid: cscId,
                    irctc: idxirctc > -1 ? (row[idxirctc] || '').toString().trim() : '-',
                    vlename: idxvlename > -1 ? (row[idxvlename] || '').toString().trim() : '-',
                    olddist: idxolddist > -1 ? (row[idxolddist] || '').toString().trim() : '-',
                    newdist: idxnewdist > -1 ? (row[idxnewdist] || '').toString().trim() : '-',
                    mob: idxmob > -1 ? (row[idxmob] || '').toString().trim() : '-',
                    vlemob: idxvlemob > -1 ? (row[idxvlemob] || '').toString().trim() : '-',
                    dmname: idxempname > -1 ? (row[idxempname] || '').toString().trim() : '-',
                    hoRemark: hoRemarks,
                    status: status,
                    lifetimeTxns: lifetimeTxns,
                    fy27: fy27Total
                });
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                searchVLE();
            }
        }

        function searchVLE() {
            if (!isDataReady) return; 

            let query = document.getElementById("vleSearchInput").value.trim().toLowerCase();
            let formCard = document.getElementById("editorFormCard");
            let btn = document.getElementById("btnSearch");

            formCard.style.display = "none";
            
            if (query === "") {
                showToast("⚠️ Enter CSC ID or IRCTC ID first!");
                return;
            }

            btn.innerText = "Searching...";

            setTimeout(() => {
                let foundIndex = globalVlesList.findIndex(v => 
                    v.cscid.toLowerCase() === query || 
                    v.irctc.toLowerCase() === query
                );

                btn.innerText = "Fetch Details";

                if (foundIndex > -1) {
                    selectedVleIndex = foundIndex;
                    let v = globalVlesList[foundIndex];

                    document.getElementById("editCscId").value = v.cscid;
                    document.getElementById("editVleName").value = v.vlename;
                    document.getElementById("editIrctcId").value = v.irctc;
                    document.getElementById("editOldDist").value = v.olddist;
                    document.getElementById("editNewDist").value = v.newdist;
                    document.getElementById("editMob").value = v.mob;
                    document.getElementById("editVleMob").value = v.vlemob;
                    document.getElementById("editDmName").value = v.dmname;
                    document.getElementById("editHoRemarks").value = v.hoRemark;

                    let badge = document.getElementById("vleStatusBadge");
                    badge.className = "status-badge";
                    
                    if (v.status === 'blocked') {
                        badge.innerText = "HO Blocked 🚫";
                        badge.classList.add("status-blocked");
                    } else if (v.status === 'never') {
                        badge.innerText = "Never Active ⚠️";
                        badge.classList.add("status-never");
                    } else if (v.status === 'inactive') {
                        badge.innerText = "Inactive ❌";
                        badge.classList.add("status-inactive");
                    } else {
                        badge.innerText = "Active ✅";
                        badge.classList.add("status-active");
                    }

                    formCard.style.display = "block";
                    showToast("🔍 VLE Details Found & Loaded!");
                } else {
                    selectedVleIndex = -1;
                    showToast("❌ VLE Record Not Found! Check the ID.");
                }
            }, 300); 
        }

        // 🌟 ZERO DELAY BACKGROUND SAVING LOGIC 🌟
        function saveVLEChanges() {
            if (selectedVleIndex === -1) return;

            let cscId = document.getElementById("editCscId").value;
            let vleName = document.getElementById("editVleName").value.trim();
            let irctcId = document.getElementById("editIrctcId").value.trim();
            let oldDist = document.getElementById("editOldDist").value.trim();
            let newDist = document.getElementById("editNewDist").value.trim();
            let mob = document.getElementById("editMob").value.trim();
            let vleMob = document.getElementById("editVleMob").value.trim();
            let hoRemarks = document.getElementById("editHoRemarks").value.trim();

            if(vleName === "" || mob === "") {
                showToast("⚠️ VLE Name and Mobile can't be empty!");
                return;
            }

            let btn = document.getElementById("btnSaveChanges");
            let originalText = btn.innerText;
            btn.innerText = "⏳ SAVING...";
            btn.disabled = true;

            let payload = {
                action: "updateVleDetails", 
                cscid: cscId,
                vlename: vleName,
                irctcid: irctcId,
                olddistrict: oldDist,
                newdistrict: newDist,
                mobile: mob,
                vlemob: vleMob,
                horemarks: hoRemarks
            };

            // 1. Send data to Google Sheet in the Background (No await)
            fetch(apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(response => response.text())
              .then(result => console.log("Google Sheet Updated:", result))
              .catch(err => console.error("Background Save Error:", err));

            // 2. Instantly update the local UI Data (Optimistic Update)
            let v = globalVlesList[selectedVleIndex];
            v.vlename = vleName;
            v.irctc = irctcId;
            v.olddist = oldDist;
            v.newdist = newDist;
            v.mob = mob;
            v.vlemob = vleMob;
            v.hoRemark = hoRemarks;

            let hoLower = hoRemarks.toLowerCase();
            if(hoLower.includes('suspend') || hoLower.includes('blacklist') || hoLower.includes('block')) {
                v.status = 'blocked';
            } else if(v.lifetimeTxns === 0) {
                v.status = 'never';
            } else if(v.fy27 === 0) {
                v.status = 'inactive';
            } else {
                v.status = 'active';
            }

            // Remove caches globally so updates show on next load
            sessionStorage.removeItem("cscTravelData");
            localStorage.removeItem("cscGlobalData");

            showToast("🎉 Details Updated Successfully!");

            // 3. Quickly reset the UI within half a second!
            setTimeout(() => {
                document.getElementById("editorFormCard").style.display = "none";
                document.getElementById("vleSearchInput").value = "";
                selectedVleIndex = -1;
                btn.innerText = originalText;
                btn.disabled = false;
            }, 600);
        }

        function showToast(msg) {
            let toast = document.getElementById("toast");
            if(toast) {
                if(msg.includes("❌") || msg.includes("⚠️")) {
                    toast.style.backgroundColor = "#991b1b"; 
                    toast.style.borderColor = "#fca5a5";
                } else {
                    toast.style.backgroundColor = "#122d22"; 
                    toast.style.borderColor = "#c5a059";
                }
                toast.innerText = msg;
                toast.style.display = "block";
                setTimeout(() => { toast.style.display = "none"; }, 3000);
            }
        }

        function toggleFullScreen() {
            let btn = document.getElementById("fullscreenBtn");
            try {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    btn.innerHTML = "✖ Exit Full Screen";
                    btn.style.backgroundColor = "#991b1b"; btn.style.color = "#ffffff"; btn.style.borderColor = "#991b1b";
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            } catch (e) { console.log("Fullscreen not supported"); }
        }

        document.addEventListener('fullscreenchange', (event) => {
            let btn = document.getElementById("fullscreenBtn");
            if (!document.fullscreenElement) {
                btn.innerHTML = "⛶ Full Screen";
                btn.style.backgroundColor = "#ffffff"; btn.style.color = "#1b4332"; btn.style.borderColor = "#1b4332";
            }
        });
    </script>
</body>
</html>
